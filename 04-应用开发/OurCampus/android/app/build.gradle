apply plugin: 'com.android.application'

def campusPushProperties = new Properties()
def campusPushFile = rootProject.file('push.local.properties')
if (campusPushFile.exists()) campusPushFile.withInputStream { campusPushProperties.load(it) }
def vivoPushEnabled = campusPushProperties.getProperty('VIVO_PUSH_ENABLED', 'false').trim().equalsIgnoreCase('true')
if (vivoPushEnabled && ['GETUI_APP_ID', 'VIVO_APP_ID', 'VIVO_APP_KEY'].any {
    !campusPushProperties.getProperty(it, '').trim()
}) {
    throw new GradleException('启用 vivo 推送前，请在 push.local.properties 填写 GETUI_APP_ID、VIVO_APP_ID、VIVO_APP_KEY。')
}

def campusSigningProperties = new Properties()
def campusSigningFile = rootProject.file('signing.local.properties')
if (campusSigningFile.exists()) campusSigningFile.withInputStream { campusSigningProperties.load(it) }

def campusSigningValues = [:]
['KEYSTORE_FILE', 'KEY_ALIAS', 'STORE_PASSWORD', 'KEY_PASSWORD'].each { key ->
    def configured = campusSigningProperties.getProperty(key)
    campusSigningValues[key] = configured != null && !configured.trim().isEmpty()
        ? configured : System.getenv("OURCAMPUS_${key}")
}
def campusReleaseSigningReady = campusSigningValues.values().every { it != null && !it.trim().isEmpty() }
if (campusReleaseSigningReady) {
    campusReleaseSigningReady = rootProject.file(campusSigningValues.KEYSTORE_FILE).isFile()
}
// Check the resolved task graph so aggregate tasks such as "build" also fail closed.
gradle.taskGraph.whenReady { taskGraph ->
    if (!campusReleaseSigningReady && taskGraph.allTasks.any {
        it.project == project && it.name.toLowerCase(Locale.ROOT).contains('release')
    }) {
        throw new GradleException('请在原打包电脑配置原签名，不能使用临时debug签名发布升级包')
    }
}

android {
    namespace = "cn.edu.sxau.campustwin"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "cn.edu.sxau.campustwin"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 19
        versionName "1.18"
        manifestPlaceholders = [
            GETUI_APPID: campusPushProperties.getProperty('GETUI_APP_ID', '').trim(),
            VIVO_PUSH_ENABLED: vivoPushEnabled.toString(),
            VIVO_APP_ID: vivoPushEnabled ? campusPushProperties.getProperty('VIVO_APP_ID', '').trim() : '',
            VIVO_APP_KEY: vivoPushEnabled ? campusPushProperties.getProperty('VIVO_APP_KEY', '').trim() : '',
        ]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (campusReleaseSigningReady) {
                storeFile rootProject.file(campusSigningValues.KEYSTORE_FILE)
                keyAlias campusSigningValues.KEY_ALIAS
                storePassword campusSigningValues.STORE_PASSWORD
                keyPassword campusSigningValues.KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            if (campusReleaseSigningReady) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation 'com.getui:gtsdk:3.3.16.0'
    implementation 'com.getui:gtc:3.3.3.0'
    if (vivoPushEnabled) implementation 'com.assist-v3:vivo:3.2.0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
