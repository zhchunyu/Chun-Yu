<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>安全管理模式 · 效果验证台</title>
<style>
  :root {
    --bg: #0d141c;
    --panel: #141d27;
    --panel-2: #1a2530;
    --line: #24313e;
    --text: #dce6f0;
    --text-dim: #8fa3b8;
    --accent: #4ea1ff;
    --ok: #3fa96a;
    --warn: #e0a92b;
    --high: #e2703a;
    --crit: #d1414a;
    --info: #5b8def;
    font-synthesis: none;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.55 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  .harness { max-width: 1440px; margin: 0 auto; padding: 20px 22px 60px; }
  .harness__head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .harness__head h1 { font-size: 20px; margin: 0; letter-spacing: .5px; }
  .harness__sub { color: var(--text-dim); font-size: 12.5px; }
  .demo-badge {
    display: inline-block; padding: 1px 7px; border-radius: 3px; font-size: 11px;
    background: #3a2f16; color: #e8c46a; border: 1px solid #5c4a1e; margin-left: 8px;
  }

  /* ---- 场景切换 ---- */
  .scenario-bar {
    display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 20px;
    padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  }
  .scenario-bar__label { color: var(--text-dim); font-size: 12.5px; align-self: center; margin-right: 4px; }
  .scenario-btn {
    padding: 6px 13px; border-radius: 6px; cursor: pointer; font-size: 13px;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    transition: .15s;
  }
  .scenario-btn:hover { border-color: var(--accent); }
  .scenario-btn.is-active { background: var(--accent); color: #06121f; border-color: var(--accent); font-weight: 600; }

  /* ---- 通用面板 ---- */
  .harness section, .harness .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px 16px; margin-bottom: 14px;
  }
  .harness h2 { font-size: 15px; margin: 22px 0 10px; color: var(--text); }
  .harness h2 small { color: var(--text-dim); font-weight: 400; font-size: 12px; margin-left: 8px; }
  .row { display: grid; gap: 14px; }
  .row--2 { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
  .row--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (max-width: 1100px) { .row--2, .row--3 { grid-template-columns: 1fr; } }

  /* ---- 风险总览 ---- */
  .risk-overview__head, .response-metrics__head, .alert-timeline__head, .spatial-status__head,
  .crowd-threshold-control__head, .evidence-chain__header, .safety-briefing__head,
  .weather-strip__head, .alert-card__playbook-head {
    display: flex; align-items: center; gap: 7px; margin-bottom: 11px;
  }
  .risk-overview__head strong, .response-metrics__head strong { font-size: 13.5px; }
  .risk-overview__head small, .response-metrics__head small, .spatial-status__head small { color: var(--text-dim); font-size: 11.5px; }
  .risk-overview__active { margin-left: auto; font-size: 11.5px; color: var(--text-dim); }
  .risk-overview__grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .risk-tile {
    background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--tile-color);
    border-radius: 6px; padding: 9px 10px; display: flex; flex-direction: column; gap: 1px;
  }
  .risk-tile.is-zero { opacity: .42; }
  .risk-tile__count { font-size: 21px; font-weight: 700; color: var(--tile-color); line-height: 1.1; }
  .risk-tile__label { font-size: 11.5px; color: var(--text-dim); }
  .risk-overview__summary { margin-top: 10px; font-size: 12px; color: var(--text-dim); }

  /* ---- 处置时效 ---- */
  .response-metrics__grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .response-tile {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px;
    display: grid; grid-template-columns: auto 1fr; gap: 0 7px; align-items: center;
  }
  .response-tile.is-warn { border-color: var(--high); }
  .response-tile__icon { color: var(--accent); }
  .response-tile__value { font-size: 18px; font-weight: 700; }
  .response-tile__label { grid-column: 1 / -1; font-size: 11.5px; color: var(--text-dim); }
  .response-tile__hint { grid-column: 1 / -1; font-size: 10.5px; color: #6d8399; }
  .response-metrics__by-level { list-style: none; margin: 10px 0 0; padding: 0; font-size: 12px; }
  .response-level-row { display: flex; align-items: center; gap: 7px; padding: 3px 0; }
  .response-level-row__dot { width: 7px; height: 7px; border-radius: 50%; }
  .response-level-row__label { min-width: 46px; }
  .response-level-row__count { color: var(--text-dim); }
  .response-level-row__avg { margin-left: auto; color: var(--text-dim); }

  /* ---- 预警时间线 ---- */
  .alert-timeline__count { margin-left: auto; font-size: 11.5px; color: var(--text-dim); }
  .alert-timeline__list { list-style: none; margin: 0; padding: 0; }
  .timeline-item { border-bottom: 1px solid var(--line); }
  .timeline-item:last-child { border-bottom: none; }
  .timeline-item__button {
    width: 100%; display: flex; align-items: center; gap: 9px; padding: 7px 2px;
    background: none; border: none; color: inherit; text-align: left; cursor: pointer; font: inherit;
  }
  .timeline-item__time { color: var(--text-dim); font-variant-numeric: tabular-nums; font-size: 12px; }
  .timeline-item__badge {
    padding: 1px 6px; border-radius: 3px; font-size: 11px; font-weight: 600;
    background: color-mix(in srgb, var(--item-color) 22%, transparent); color: var(--item-color);
    border: 1px solid color-mix(in srgb, var(--item-color) 45%, transparent);
  }
  .timeline-item__title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .timeline-item__state { font-size: 11.5px; color: var(--text-dim); }
  .alert-timeline__empty { color: var(--text-dim); font-size: 12.5px; padding: 8px 0; }

  /* ---- 空间态势 ---- */
  .spatial-status__groups { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .spatial-group { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; }
  .spatial-group__head { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 6px; }
  .spatial-group__count {
    margin-left: auto; font-size: 11px; background: var(--line); padding: 0 6px; border-radius: 8px;
  }
  .spatial-group__list { list-style: none; margin: 0; padding: 0; font-size: 11.5px; color: #b9cbdd; }
  .spatial-group__list li { padding: 2px 0; font-family: Consolas, monospace; font-size: 11px; }
  .spatial-group__empty { font-size: 11.5px; color: var(--text-dim); }
  .spatial-group__state { font-size: 11.5px; color: var(--ok); }
  .spatial-group__state.is-paused { color: var(--warn); }
  .spatial-status__risks { margin-top: 11px; border-top: 1px solid var(--line); padding-top: 9px; }
  .spatial-status__risks-head { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
  .spatial-status__risks ul { margin: 0; padding-left: 18px; font-size: 12px; }

  /* ---- 天气条 ---- */
  .weather-strip { border-left: 3px solid var(--weather-color); }
  .weather-strip__icon { display: flex; }
  .weather-strip__title-block { flex: 1; min-width: 0; }
  .weather-strip__title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .weather-strip__text { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .weather-strip__change { font-size: 11.5px; padding: 1px 7px; border-radius: 3px; font-weight: 600; }
  .weather-strip__change.is-up { background: #4a2020; color: #ff9b9b; }
  .weather-strip__change.is-down { background: #1e3a26; color: #8be0a8; }
  .weather-strip__metrics { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 12px 0; }
  .weather-metric { background: var(--panel-2); border-radius: 5px; padding: 6px 8px; display: flex; flex-direction: column; }
  .weather-metric__value { font-size: 14px; font-weight: 600; }
  .weather-metric__label { font-size: 10.5px; color: var(--text-dim); }
  .weather-strip__switcher { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .weather-chip {
    padding: 4px 10px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line);
    color: var(--text-dim); cursor: pointer; font: inherit; font-size: 12px;
  }
  .weather-chip.is-active { color: var(--text); border-width: 1.5px; }
  .weather-strip__translation { border-top: 1px solid var(--line); padding-top: 11px; }
  .weather-strip__translation-head { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; }
  .weather-strip__translation-head small { color: var(--text-dim); font-size: 11.5px; margin-left: 4px; }
  .weather-strip__risks { font-size: 12px; color: #b9cbdd; margin-bottom: 8px; }
  .weather-strip__risks-label { color: var(--text-dim); }
  .weather-strip__actions { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .weather-action { display: grid; grid-template-columns: auto auto 1fr; gap: 7px; align-items: baseline; font-size: 12px; }
  .weather-action__label { font-weight: 600; }
  .weather-action__detail { color: var(--text-dim); font-size: 11px; }
  .weather-strip__no-action { color: var(--text-dim); font-size: 12px; }

  /* ---- 预警卡片 ---- */
  .alert-card {
    background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--alert-color);
    border-radius: 8px; padding: 13px 15px; margin-bottom: 14px;
  }
  .alert-card__header { display: flex; gap: 10px; align-items: flex-start; }
  .alert-card__level {
    color: #fff; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 3px; flex-shrink: 0;
  }
  .alert-card__headline { flex: 1; min-width: 0; }
  .alert-card__title {
    background: none; border: none; color: var(--text); font: inherit; font-size: 15px; font-weight: 600;
    padding: 0; cursor: pointer; text-align: left;
  }
  .alert-card__title:disabled { cursor: default; }
  .alert-card__meta { font-size: 11.5px; color: var(--text-dim); margin-top: 3px; display: flex; gap: 6px; flex-wrap: wrap; }
  .alert-card__dot { opacity: .5; }
  .alert-card__state { padding: 0 6px; border-radius: 3px; background: var(--line); }
  .alert-card__state.is-verifying { background: #3a3520; color: #e8d48a; }
  .alert-card__state.is-published { background: #1e3a26; color: #8be0a8; }
  .alert-card__state.is-dispatched { background: #26364a; color: #9cc4f0; }
  .alert-card__escalation {
    margin-top: 9px; font-size: 12px; color: #f0b98a; background: #2b2015;
    border: 1px solid #4a3720; border-radius: 5px; padding: 6px 9px; display: flex; gap: 7px; align-items: center;
  }
  .alert-card__sla {
    margin-top: 8px; font-size: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 6px 9px; border-radius: 5px; background: var(--panel-2);
  }
  .alert-card__sla.is-overdue { background: #3a1c1c; color: #ffb0b0; }
  .alert-card__sla-detail { color: var(--text-dim); }
  .alert-card__sla.is-overdue .alert-card__sla-detail { color: #ffc9c9; }
  .alert-card__sla-target { margin-left: auto; font-size: 11.5px; color: var(--text-dim); }
  .alert-card__confidence { margin-top: 8px; display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .alert-card__confidence-label { color: var(--text-dim); }
  .alert-card__confidence-value { font-weight: 700; font-size: 14px; }
  .alert-card__confidence-value.is-high { color: var(--ok); }
  .alert-card__confidence-value.is-mid { color: var(--warn); }
  .alert-card__confidence-value.is-low { color: var(--crit); }

  .alert-card__playbook { margin-top: 13px; border-top: 1px solid var(--line); padding-top: 11px; }
  .alert-card__playbook-count { margin-left: auto; font-size: 11.5px; color: var(--text-dim); }
  .playbook-steps { list-style: none; margin: 0 0 11px; padding: 0; }
  .playbook-step { display: flex; gap: 9px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .playbook-step:last-child { border-bottom: none; }
  .playbook-step__icon { color: var(--accent); padding-top: 2px; }
  .playbook-step__body { flex: 1; min-width: 0; }
  .playbook-step__line { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .playbook-step__target { font-size: 11.5px; color: var(--text-dim); }
  .playbook-step__note { font-size: 11px; color: #6d8399; margin-top: 1px; }
  .playbook-step__missing { font-size: 11px; color: var(--crit); margin-top: 2px; }
  .playbook-step.is-done .playbook-step__icon { color: var(--ok); }
  .playbook-step.is-blocked { opacity: .6; }
  .alert-card__playbook-actions { display: flex; gap: 8px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    cursor: pointer; font: inherit; font-size: 12.5px;
  }
  .btn--primary { background: var(--accent); color: #06121f; border-color: var(--accent); font-weight: 600; }
  .btn--danger { background: #3a1c1c; color: #ffb0b0; border-color: #5c2a2a; }
  .btn--ghost { background: transparent; }
  .btn.is-disabled, .btn:disabled { opacity: .45; cursor: not-allowed; }
  .alert-card__dispatches { list-style: none; margin: 9px 0 0; padding: 0; }
  .dispatch-row {
    display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 5px 9px;
    background: var(--panel-2); border-radius: 5px; margin-bottom: 5px;
  }
  .dispatch-row__role { font-weight: 600; }
  .dispatch-row__task { color: var(--text-dim); flex: 1; min-width: 0; }
  .dispatch-row__count { color: var(--text-dim); }
  .dispatch-row__status { font-size: 11px; padding: 0 6px; border-radius: 3px; background: var(--line); }
  .alert-card__advance { display: flex; gap: 7px; margin-top: 11px; flex-wrap: wrap; }
  .alert-card__evidence, .alert-card__history { margin-top: 11px; }
  .alert-card__evidence > summary, .alert-card__history > summary {
    cursor: pointer; font-size: 12.5px; color: var(--accent); display: flex; align-items: center; gap: 6px;
    padding: 4px 0;
  }
  .alert-card__timeline { list-style: none; margin: 9px 0 0; padding: 0 0 0 4px; }
  .timeline-row {
    display: grid; grid-template-columns: 46px 76px 1fr auto; gap: 9px; font-size: 11.5px;
    padding: 5px 0; border-bottom: 1px dashed var(--line);
  }
  .timeline-row.is-latest { color: var(--text); }
  .timeline-row__time { color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .timeline-row__state { font-weight: 600; }
  .timeline-row__detail { color: var(--text-dim); }
  .timeline-row__actor { color: #6d8399; }

  /* ---- 证据链 ---- */
  .evidence-chain { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 12px 13px; }
  .evidence-chain__title { font-size: 13px; font-weight: 600; }
  .evidence-chain__score { margin-left: auto; font-size: 17px; font-weight: 700; }
  .evidence-chain__score.is-passed { color: var(--ok); }
  .evidence-chain__score.is-pending { color: var(--warn); }
  .evidence-chain__threshold { font-size: 11.5px; color: var(--text-dim); }
  .evidence-chain__warning {
    display: flex; gap: 7px; align-items: center; font-size: 11.5px; color: #f0b98a;
    background: #2b2015; border: 1px solid #4a3720; border-radius: 5px; padding: 6px 9px; margin-bottom: 9px;
  }
  .evidence-chain__rows { list-style: none; margin: 0; padding: 0; }
  .evidence-row {
    display: grid; grid-template-columns: 88px 54px 1fr; gap: 9px; padding: 5px 0;
    border-bottom: 1px dashed var(--line); font-size: 12px; align-items: baseline;
  }
  .evidence-row__label { color: var(--text); }
  .evidence-row__value { font-weight: 700; font-variant-numeric: tabular-nums; }
  .evidence-row.is-positive .evidence-row__value { color: var(--ok); }
  .evidence-row.is-negative .evidence-row__value { color: var(--crit); }
  .evidence-row.is-neutral .evidence-row__value { color: var(--text-dim); }
  .evidence-row__detail { color: var(--text-dim); font-size: 11px; }
  .evidence-chain__formula {
    margin-top: 9px; padding: 6px 9px; background: #101a24; border-radius: 5px;
    font-family: Consolas, monospace; font-size: 12px; color: #9cc4f0; letter-spacing: .4px;
  }
  .evidence-chain__verdict {
    margin-top: 9px; display: flex; gap: 7px; align-items: center; font-size: 12px;
    padding: 7px 9px; border-radius: 5px;
  }
  .evidence-chain__verdict.is-passed { background: #1a2f22; color: #8be0a8; }
  .evidence-chain__verdict.is-pending { background: #3a3520; color: #e8d48a; }
  .evidence-chain__extra { list-style: none; margin: 11px 0 0; padding: 9px 0 0; border-top: 1px dashed var(--line); }
  .evidence-chain__extra-title { font-size: 11.5px; color: var(--text-dim); display: flex; gap: 6px; align-items: center; margin-bottom: 5px; }
  .evidence-extra-row { display: grid; grid-template-columns: 88px 1fr; gap: 9px; font-size: 11.5px; padding: 2px 0; }
  .evidence-extra-row__label { color: var(--text-dim); }
  .evidence-extra-row__detail { color: #b9cbdd; }

  /* ---- 阈值控制 ---- */
  .crowd-threshold-control__mode { margin-left: auto; font-size: 11px; color: var(--warn); }
  .crowd-threshold-control__mode.is-editable { color: var(--ok); }
  .crowd-threshold-control__intro { font-size: 12px; color: var(--text-dim); margin: 0 0 12px; }
  .threshold-row {
    display: grid; grid-template-columns: 78px repeat(3, 92px) 1fr; gap: 9px; align-items: center;
    padding: 8px 0; border-bottom: 1px dashed var(--line);
  }
  .threshold-row__level { display: flex; align-items: center; gap: 7px; font-size: 12.5px; }
  .threshold-row__dot { width: 8px; height: 8px; border-radius: 50%; }
  .threshold-field { display: flex; flex-direction: column; gap: 2px; }
  .threshold-field__label { font-size: 10.5px; color: var(--text-dim); }
  .threshold-field input {
    width: 100%; padding: 4px 6px; border-radius: 4px; border: 1px solid var(--line);
    background: #0f1922; color: var(--text); font: inherit; font-size: 12px;
  }
  .threshold-row__hint { font-size: 11px; color: #6d8399; display: flex; gap: 6px; align-items: center; }
  .threshold-weather-preview { margin-top: 12px; padding: 10px 11px; background: var(--panel-2); border-radius: 6px; }
  .threshold-weather-preview__head { display: flex; gap: 7px; align-items: center; font-size: 12.5px; margin-bottom: 6px; }
  .threshold-weather-preview ul { list-style: none; margin: 0; padding: 0; font-size: 11.5px; }
  .threshold-weather-preview li { padding: 2px 0; color: #b9cbdd; }
  .threshold-weather-preview__delta { color: var(--text-dim); }
  .threshold-empty { margin-top: 10px; font-size: 11.5px; color: var(--text-dim); display: flex; gap: 7px; align-items: center; }
  .capacity-basis-list { margin-top: 13px; border-top: 1px solid var(--line); padding-top: 11px; }
  .capacity-basis-list__head { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
  .capacity-basis { background: var(--panel-2); border-radius: 5px; padding: 8px 10px; margin-bottom: 6px; }
  .capacity-basis__head { display: flex; gap: 7px; align-items: baseline; font-size: 12px; flex-wrap: wrap; }
  .capacity-basis__formula { color: var(--accent); font-size: 11.5px; margin-left: auto; }
  .capacity-basis__rationale { font-size: 11.5px; color: var(--text-dim); margin: 4px 0 0; }
  .capacity-basis__result { font-size: 11.5px; color: #8be0a8; margin-top: 4px; }

  /* ---- 安全简报 ---- */
  .safety-briefing__mode { margin-left: auto; font-size: 11px; color: var(--text-dim); background: var(--line); padding: 1px 7px; border-radius: 3px; }
  .safety-briefing__text { font-size: 13px; line-height: 1.65; margin: 0 0 10px; color: #e6eef7; }
  .safety-briefing__facts { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; }
  .safety-briefing__facts-label { color: var(--text-dim); }
  .safety-fact { color: #b9cbdd; }
  .safety-briefing__note {
    margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--line);
    font-size: 11.5px; color: #6d8399;
  }

  /* ---- 自查面板 ---- */
  .selfcheck { display: grid; gap: 8px; }
  .selfcheck-row { display: flex; align-items: center; gap: 9px; font-size: 12.5px; }
  .selfcheck-badge { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 3px; }
  .selfcheck-badge.is-pass { background: #1e3a26; color: #8be0a8; }
  .selfcheck-badge.is-fail { background: #3a1c1c; color: #ffb0b0; }
  .selfcheck-name { font-family: Consolas, monospace; font-size: 11.5px; color: var(--text-dim); }
  .selfcheck-summary { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line); font-size: 13px; font-weight: 600; }
  .selfcheck-summary.is-ok { color: var(--ok); }
  .selfcheck-summary.is-bad { color: var(--crit); }
</style>
</head>
<body>
<div class="harness" id="root">
  <div class="harness__head">
    <h1>安全管理模式 · 效果验证台</h1>
    <span class="harness__sub">真实 DOM 渲染 ｜ 数据源为 W3 预置场景快照</span>
    <span class="demo-badge">演示数据</span>
  </div>
  <div id="app"></div>
  <div id="error"></div>
</div>

<script>
  // 先把错误捕获装上，再加载业务脚本 —— 否则 bundle 阶段的报错会看不到
  window.__ERRORS__ = []
  window.addEventListener('error', (e) => {
    window.__ERRORS__.push(`${e.message} @ ${e.filename}:${e.lineno}`)
    var box = document.getElementById('error')
    if (box) box.textContent = window.__ERRORS__.join(' | ')
  })
  window.addEventListener('unhandledrejection', (e) => {
    window.__ERRORS__.push('unhandledrejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason))
    var box = document.getElementById('error')
    if (box) box.textContent = window.__ERRORS__.join(' | ')
  })
</script>
<script src="./bundle.js"></script>
<script src="./harness.js"></script>
</body>
</html>
