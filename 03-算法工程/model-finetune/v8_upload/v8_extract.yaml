# LLaMA-Factory 训练配置 V8 — Qwen2.5-14B QLoRA
# 事件结构化提取 LoRA（校园事件 JSON 抽取）
#
# ★ 这是「两个独立适配器」中的第一个：提取 LoRA
#   第二个（人设化回应）见 v7_train.yaml。两者分开训、分开存 checkpoint，
#   部署时用 vLLM 的 --enable-lora 同时挂载两个适配器，按请求选。
#
# ★ 与 V8 数据集的对应关系：
#   数据集 = v3_train.json 修补而来（去 182 条重复 + 重绑 984 条 advice
#            + 重写 744 条 description 套话），保留 v3 丰富的句式资产。
#
# ★ 提取任务的特殊性（决定了超参与回应任务不同）：
#   1. 输出是严格 JSON —— 要求 token 级精确，过拟合风险高于回应任务
#      ⇒ learning_rate 取 1.0e-4（比回应任务的 2e-4 保守），epoch 只跑 2
#   2. 样本短（输入 ~30 字，输出 ~200 字）⇒ cutoff_len 512 足够
#   3. 评估指标看「JSON 可解析率」而非 loss ⇒ do_eval 必开
#
# 上传位置：/root/autodl-tmp/v8_extract.yaml
# 数据集位置：/root/autodl-tmp/data/v8_extract_train.json + v8_extract_eval.json

### 模型
model_name_or_path: /root/autodl-tmp/models/models/qwen--Qwen2.5-14B-Instruct/snapshots/master

### 训练方法
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 128
lora_alpha: 256
lora_dropout: 0.05
lora_target: all

### 量化
quantization_bit: 4
quantization_type: nf4
double_quantization: true

### 数据集
dataset: auv_v8_extract
eval_dataset: auv_v8_extract_eval
dataset_dir: /root/autodl-tmp/data
template: qwen
cutoff_len: 512
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 8

### 输出
output_dir: /root/autodl-tmp/output/qwen25-14b-auv-v8-extract
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1

### 评估与日志
do_eval: true
eval_strategy: steps
eval_steps: 100
logging_steps: 10
save_strategy: epoch
save_total_limit: 2

### 其他
fp16: true
gradient_checkpointing: true
ddp_timeout: 180000000
report_to: none
