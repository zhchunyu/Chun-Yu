# LLaMA-Factory 训练配置 V5 — Qwen2.5-14B QLoRA 第五轮
# AUV 人设升级版 — 融合17本书的智慧
# 基于 V4 继续训练，进一步深化人格

### 模型
model_name_or_path: /root/autodl-tmp/models/models/qwen--Qwen2.5-14B-Instruct/snapshots/master
adapter_name_or_path: /root/autodl-tmp/output/qwen25-14b-auv-v1

### 训练方法
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target: all

### 量化
quantization_bit: 4
quantization_type: nf4

### 数据集
dataset: auv_persona
dataset_dir: /root/autodl-tmp/data
template: qwen

### 输出
output_dir: /root/autodl-tmp/output/qwen25-14b-auv-v2
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 3.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1

### 日志 & 保存
logging_steps: 10
save_steps: 300
save_total_limit: 2

### 其他
fp16: true
gradient_checkpointing: true
ddp_timeout: 180000000

### 评估（关闭）
do_eval: false
