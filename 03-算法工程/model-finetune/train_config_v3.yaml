# LLaMA-Factory 训练配置 V3 — Qwen2.5-14B QLoRA 第三轮
# 改进：1530条数据 + V1同款instruction + 类型边界强化
# 注意：这轮从基座模型重新训（不从V2继续），因为V2的格式跑偏了

### 模型
model_name_or_path: /root/autodl-tmp/models/models/qwen--Qwen2.5-14B-Instruct/snapshots/master

### 训练方法
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target: all

### 量化
quantization_bit: 4
quantization_type: nf4

### 数据集
dataset: campus_event_extraction
dataset_dir: /root/autodl-tmp/data
template: qwen

### 输出
output_dir: /root/autodl-tmp/output/qwen25-14b-event-v3
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1

### 日志 & 保存
logging_steps: 20
save_steps: 300
save_total_limit: 3

### 其他
fp16: true
gradient_checkpointing: true
ddp_timeout: 180000000

### 评估（关闭）
do_eval: false
