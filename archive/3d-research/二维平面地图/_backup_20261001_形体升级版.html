<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>校园总平面图 · 2D 平面版</title>
<style>
  :root{
    --ui-bg: rgba(24,25,28,.86);
    --ui-bd: rgba(255,255,255,.10);
    --ui-fg: #ECEAE4;
    --ui-fg2: #9C9A93;
    --ui-acc: #E0A458;
    --ui-hover: rgba(255,255,255,.08);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:#111214;color:var(--ui-fg);
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    overflow:hidden;
  }
  #app{position:fixed;inset:0}

  /* ============ 画布 ============ */
  #stage{position:absolute;inset:0;overflow:hidden;background:var(--m-bg);cursor:grab}
  #stage.dragging{cursor:grabbing}
  #map{width:100%;height:100%;display:block;touch-action:none}

  /* ============ 图元样式（由主题变量驱动） ============ */
  .bl{stroke-width:1.25;stroke-linejoin:round}
  .bl > *{fill:inherit;stroke:inherit}                 /* 组合形体：子元素继承本建筑配色 */
  .bl > .anx{opacity:.82}                              /* 附楼 / 裙房：略浅，形成体量层次 */
  .bl > .rooflayer{opacity:1}

  /* 屋顶构件（stroke 继承建筑描边色，仅控制粗细与浓度） */
  .rf-a      {fill:var(--rf-lite)}                     /* 坡面·受光侧 */
  .rf-b      {fill:var(--rf-dark)}                     /* 坡面·背光侧 */
  .rf-eave   {fill:none;stroke-width:1;opacity:.58}
  .rf-ridge  {fill:none;stroke-width:2.6;opacity:.74;stroke-linecap:round}
  .rf-raf    {fill:none;stroke-width:.8;opacity:.34}
  .rf-parapet{fill:none;stroke-width:1.5;opacity:.62}
  .rf-parapet2{fill:none;stroke-width:.7;opacity:.34}
  .rf-grid   {fill:none;stroke-width:.55;opacity:.22}
  .rf-saw    {fill:var(--rf-dark);opacity:.34}
  .rf-strip  {fill:none;stroke-width:1.6;opacity:.36;stroke-linecap:round}
  .rf-unit   {fill:var(--rf-dark);stroke-width:.9;opacity:.5}
  .rf-stair  {fill:var(--rf-lite);stroke-width:1;opacity:.9}
  .rf-court  {fill:none;stroke-width:1.1;opacity:.5}

  .wall{fill:none;stroke:var(--m-wall);stroke-width:3.2;stroke-dasharray:9 6;opacity:.6;stroke-linecap:round}
  .plz{fill:var(--m-plaza);stroke:var(--m-plazaEdge);stroke-width:1.2}
  .rd{stroke:var(--m-road)}
  .rd-case{stroke:var(--m-roadCase)}
  .pt{stroke:var(--m-path);stroke-dasharray:10 8}

  /* 文字 */
  .lb,.lb-sm,.lb-lg,.lb-gate,.lb-n,.lb-road,.zl{font-family:inherit;paint-order:stroke;stroke-linejoin:round;pointer-events:none;user-select:none}
  .lb{font-size:13px;font-weight:600;fill:var(--m-label);stroke:var(--m-halo);stroke-width:3.6}
  .lb-sm{font-size:11px;font-weight:500;fill:var(--m-sub);stroke:var(--m-halo);stroke-width:3}
  .lb-lg{font-size:15px;font-weight:700;fill:var(--m-label);stroke:var(--m-halo);stroke-width:4;letter-spacing:.06em}
  .lb-gate{font-size:12.5px;font-weight:700;fill:var(--m-label);stroke:var(--m-halo);stroke-width:3.6}
  .lb-n{font-size:15px;font-weight:700;fill:var(--m-label);stroke:none}
  .lb-road{font-size:12px;font-weight:600;fill:var(--m-sub);stroke:var(--m-halo);stroke-width:3;letter-spacing:.16em;opacity:.9}
  .zl{font-size:23px;font-weight:800;letter-spacing:.24em;fill:var(--m-label);opacity:.10;stroke:none}

  /* 交互态 */
  #vp [data-id]{transition:opacity .15s ease}
  #vp .hov{filter:url(#shH);stroke-width:2.6}
  #vp .hit{stroke:var(--ui-acc);stroke-width:3.2}
  #vp .dim{opacity:.18}

  /* ============ 浮动面板通用 ============ */
  .panel{
    position:absolute;background:var(--ui-bg);border:1px solid var(--ui-bd);
    border-radius:12px;backdrop-filter:blur(14px) saturate(1.4);
    -webkit-backdrop-filter:blur(14px) saturate(1.4);
    box-shadow:0 10px 34px rgba(0,0,0,.42);
  }
  .panel h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--ui-fg2);text-transform:uppercase}

  #brand{left:20px;top:20px;padding:14px 18px 13px;min-width:236px}
  #brand .t{font-size:19px;font-weight:650;letter-spacing:.02em;line-height:1.2}
  #brand .s{font-size:11.5px;color:var(--ui-fg2);margin-top:5px;letter-spacing:.04em}
  #brand .k{font-size:11px;color:var(--ui-acc);margin-top:8px;letter-spacing:.06em;font-variant-numeric:tabular-nums}

  #tools{right:20px;top:20px;padding:12px;display:flex;flex-direction:column;gap:10px;width:236px}
  .row{display:flex;gap:6px;flex-wrap:wrap}
  .btn{
    flex:1 1 auto;min-width:44px;padding:7px 9px;border-radius:8px;border:1px solid var(--ui-bd);
    background:rgba(255,255,255,.045);color:var(--ui-fg);font-size:12px;cursor:pointer;
    transition:.15s;font-family:inherit;text-align:center;white-space:nowrap
  }
  .btn:hover{background:var(--ui-hover);border-color:rgba(255,255,255,.22)}
  .btn.on{background:var(--ui-acc);color:#20160A;border-color:var(--ui-acc);font-weight:600}
  #q{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--ui-bd);
     background:rgba(0,0,0,.28);color:var(--ui-fg);font-size:12.5px;font-family:inherit;outline:none}
  #q:focus{border-color:var(--ui-acc)}
  #q::placeholder{color:#6C6A64}

  #legend{left:20px;bottom:20px;padding:13px 16px;max-width:290px}
  #legend .lg{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:10px}
  #legend .it{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#D6D4CE}
  #legend .sw{width:13px;height:13px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.28)}
  #legend .bar{display:flex;align-items:center;gap:9px;margin-top:11px;padding-top:10px;border-top:1px solid var(--ui-bd)}
  #scalebar{height:7px;flex:none;border:1px solid #C9C7C1;border-radius:2px;
    background-image:linear-gradient(90deg,#C9C7C1 50%,transparent 50%);background-size:12px 100%}
  #scaletxt{font-size:10.5px;color:#9C9A93;white-space:nowrap}

  #drawer{
    right:20px;bottom:20px;width:300px;padding:0;overflow:hidden;
    opacity:0;transform:translateY(14px);pointer-events:none;transition:.22s cubic-bezier(.2,.8,.3,1)
  }
  #drawer.show{opacity:1;transform:none;pointer-events:auto}
  #drawer .hd{padding:14px 16px 12px;border-bottom:1px solid var(--ui-bd);display:flex;align-items:flex-start;gap:10px}
  #drawer .nm{font-size:15.5px;font-weight:640;line-height:1.3;flex:1}
  #drawer .x{cursor:pointer;color:var(--ui-fg2);font-size:17px;line-height:1;padding:2px 4px;border-radius:6px}
  #drawer .x:hover{background:var(--ui-hover);color:#fff}
  #drawer .bd{padding:12px 16px 16px;font-size:12.5px;line-height:1.75;color:#C9C7C1}
  #drawer .kv{display:flex;gap:10px;margin-bottom:5px}
  #drawer .kv i{font-style:normal;color:var(--ui-fg2);width:62px;flex:none}
  #drawer .kv b{font-weight:500;color:#E8E6E0}
  #drawer .tag{display:inline-block;padding:2.5px 9px;border-radius:20px;font-size:11px;margin-top:9px}

  #tip{
    position:absolute;pointer-events:none;padding:5px 10px;border-radius:7px;
    background:rgba(20,21,24,.92);border:1px solid var(--ui-bd);color:#F0EEE8;
    font-size:12px;white-space:nowrap;opacity:0;transition:opacity .1s;z-index:20
  }

  #hint{
    position:absolute;left:50%;transform:translateX(-50%);bottom:18px;
    font-size:11.5px;color:var(--ui-fg2);background:rgba(24,25,28,.72);
    padding:6px 14px;border-radius:20px;border:1px solid var(--ui-bd);
    backdrop-filter:blur(10px);transition:.4s;white-space:nowrap
  }
  #hint.off{opacity:0;transform:translateX(-50%) translateY(8px)}

  @media (max-width:900px){
    #legend{display:none}
    #brand .s{display:none}
    #tools{width:180px}
    #drawer{width:calc(100% - 40px)}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><svg id="map" viewBox="0 0 2400 1500" preserveAspectRatio="xMidYMid meet"></svg></div>

  <div class="panel" id="brand">
    <div class="t">校园总平面图</div>
    <div class="s">CAMPUS MASTER PLAN · 2D FLAT</div>
    <div class="k" id="stat">— 栋建筑 · — 个功能分区</div>
  </div>

  <div class="panel" id="tools">
    <input id="q" placeholder="搜索建筑 / 功能区…" autocomplete="off">
    <div class="row">
      <button class="btn" data-act="in">＋</button>
      <button class="btn" data-act="out">－</button>
      <button class="btn" data-act="reset">复位</button>
      <button class="btn" data-act="png">存图</button>
    </div>
    <div class="row" id="layers"></div>
    <div class="row" id="themes"></div>
  </div>

  <div class="panel" id="legend">
    <h2>图例</h2>
    <div class="lg" id="lgbody"></div>
    <div class="bar">
      <span id="scalebar"></span>
      <span id="scaletxt">100 m</span>
    </div>
  </div>

  <div class="panel" id="drawer">
    <div class="hd"><div class="nm" id="d-nm"></div><div class="x" id="d-x">×</div></div>
    <div class="bd" id="d-bd"></div>
  </div>

  <div id="tip"></div>
  <div id="hint">滚轮缩放 · 拖拽平移 · 点击建筑查看详情</div>
</div>

<script>
/* =========================================================================
   校园总平面图 · 2D 扁平风格
   viewBox 2400 × 1500，1 绘图单位 = 0.4 m（校园约 864 m × 504 m）
   本图为重新绘制的原创矢量平面图，非任何既有地图的翻版
   ========================================================================= */

/* ---------- 0. 主题 ---------- */
const THEMES = {
  paper:{
    label:'纸白',
    bg:'#E3E0D5', land:'#F7F5EF', landEdge:'#CFC9B8', out:'#DEDBD0', outRoad:'#CCC6B8',
    lawn:'#D4E3C5', lawnEdge:'#BCD1AA',
    tree:'#AFCB9C', treeEdge:'#8FB37B', tree3:'#C4DBB4',
    water:'#B6D8E8', water2:'#96C5DA', waterEdge:'#7CAFC8',
    road:'#FFFFFF', roadCase:'#DCD6C6', path:'#E9E4D7',
    plaza:'#E6E1D4', plazaEdge:'#D0C9B7', wall:'#B9AE97',
    link:'#EDE6D6', linkEdge:'#B3A68A',
    court:{bball:'#8FB0D2',volley:'#9CC6A6',tennis:'#D2A184',football:'#A8C79A',track:'#CE8C6C',field:'#9CC48B'},
    label:'#3A3833', sub:'#6E6A61', halo:'#FBF9F3',
    rfDark:'rgba(92,60,26,.22)', rfLite:'rgba(255,255,255,.46)',
    zones:{hist:'#D6A78B',teach:'#EBD8B4',lake:'#9CC5DA',sport:'#9FBEDD',life:'#A9BED6',lab:'#A9C6A7',serv:'#EFC894',back:'#CFC6B6'},
    types:{
      teach:['#EBD8B4','#B79A66'], lab:['#C6D8C4','#89AC87'], dorm:['#C8D6E6','#88A5C6'],
      serv:['#F0CDA2','#CD9C60'], sport:['#B4CDE4','#82A5C9'], hist:['#D6A78B','#AC7A5B'],
      admin:['#D8CFC0','#B0A28A'], med:['#E9C5C5','#C19393'], cult:['#D5C3DE','#A78DAF'],
      gh:['#CFE0D2','#98BC9F']
    }
  },
  blueprint:{
    label:'蓝图',
    bg:'#0A1D2B', land:'#0F2B3F', landEdge:'#1D4E6B', out:'#081724', outRoad:'#123549',
    lawn:'#123A4C', lawnEdge:'#1A5570',
    tree:'#1B5A70', treeEdge:'#2B7E96', tree3:'#164A5D',
    water:'#0A3550', water2:'#0E4C6C', waterEdge:'#2C86A8',
    road:'#174863', roadCase:'#0B2839', path:'#123C54',
    plaza:'#123D56', plazaEdge:'#1C5877', wall:'#2E6C8E',
    link:'#1A4C68', linkEdge:'#3E86A8',
    court:{bball:'#14526F',volley:'#155F5E',tennis:'#5A4A3E',football:'#144A4E',track:'#5E4136',field:'#14504A'},
    label:'#CFE9F5', sub:'#7FA9C0', halo:'#0A1D2B',
    rfDark:'rgba(0,0,0,.42)', rfLite:'rgba(130,210,255,.20)',
    zones:{hist:'#7E5A44',teach:'#8A7048',lake:'#2C6E8E',sport:'#2A5F86',life:'#35526F',lab:'#3A6B54',serv:'#8A6534',back:'#4A5A66'},
    types:{
      teach:['#143A55','#4FA8CE'], lab:['#12453F','#4FC2A6'], dorm:['#16324F','#4E8FC4'],
      serv:['#4A3A1C','#D8A85A'], sport:['#123C5C','#4E9CD8'], hist:['#4A2C22','#C77F55'],
      admin:['#2A3440','#8FA3B5'], med:['#4A2430','#D98A9C'], cult:['#33284A','#A98BD8'],
      gh:['#123A38','#4FB39B']
    }
  },
  night:{
    label:'夜航',
    bg:'#0E1014', land:'#171A20', landEdge:'#2A2F38', out:'#0A0C0F', outRoad:'#1E232B',
    lawn:'#1B2419', lawnEdge:'#2A3626',
    tree:'#243322', treeEdge:'#37503A', tree3:'#1D2A1C',
    water:'#0F2436', water2:'#15354C', waterEdge:'#2E6383',
    road:'#2A2F38', roadCase:'#161A20', path:'#23272E',
    plaza:'#22262D', plazaEdge:'#31363F', wall:'#4A5058',
    link:'#333942', linkEdge:'#5A6270',
    court:{bball:'#1E3A56',volley:'#1E4038',tennis:'#4A3328',football:'#1E3A28',track:'#4E2F26',field:'#1E3A28'},
    label:'#E6E4DE', sub:'#8B8A84', halo:'#0E1014',
    rfDark:'rgba(0,0,0,.46)', rfLite:'rgba(255,216,150,.15)',
    zones:{hist:'#7A5038',teach:'#7E6636',lake:'#20516F',sport:'#24507A',life:'#3A4E6A',lab:'#33614A',serv:'#7E5C2E',back:'#4A5058'},
    types:{
      teach:['#4A4234','#E8B865'], lab:['#2E4234','#7FD3A0'], dorm:['#2E3A4E','#7FAAD8'],
      serv:['#4A3A20','#F0B85E'], sport:['#2A3E58','#79AEE0'], hist:['#4A3024','#E09A6A'],
      admin:['#34383E','#A8B0B8'], med:['#4A2E34','#E09098'], cult:['#3A3048','#BFA0E8'],
      gh:['#244034','#7FD3A0']
    }
  }
};
let TH = THEMES.paper;

/* 尺度：1 绘图单位 = 0.4 m */
const UNIT_M  = 0.4;
const AREA_M2 = UNIT_M * UNIT_M;
const BAR_M   = 100;

/* ---------- 1. 建筑类型 ---------- */
const TYPE_LABEL = {
  teach:'教学', lab:'科研实验', dorm:'学生公寓', serv:'生活服务', sport:'体育设施',
  hist:'历史建筑', admin:'后勤办公', med:'医疗健康', cult:'文化礼堂', gh:'温室苗圃'
};

/* ---------- 2. 形体生成器 ---------- */
const RC = (x,y,w,h)=>[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];
/* L 形：w×h 包围盒缺掉一角（nw×nh），c = 缺角位置 */
function LG(x,y,w,h,nw,nh,c){
  if(c==='se') return [[x,y],[x+w,y],[x+w,y+h-nh],[x+w-nw,y+h-nh],[x+w-nw,y+h],[x,y+h]];
  if(c==='sw') return [[x,y],[x+w,y],[x+w,y+h],[x+nw,y+h],[x+nw,y+h-nh],[x,y+h-nh]];
  if(c==='nw') return [[x,y+nh],[x+nw,y+nh],[x+nw,y],[x+w,y],[x+w,y+h],[x,y+h]];
  return [[x,y],[x+w-nw,y],[x+w-nw,y+nh],[x+w,y+nh],[x+w,y+h],[x,y+h]];
}
/* 凹形（三面围合），s = 开口方向 */
function UG(x,y,w,h,nw,nh,s){
  if(s==='s'){ const t=(w-nw)/2; return [[x,y],[x+w,y],[x+w,y+h],[x+w-t,y+h],[x+w-t,y+h-nh],[x+t,y+h-nh],[x+t,y+h],[x,y+h]]; }
  if(s==='n'){ const t=(w-nw)/2; return [[x,y+nh],[x+t,y+nh],[x+t,y],[x+w-t,y],[x+w-t,y+nh],[x+w,y+nh],[x+w,y+h],[x,y+h]]; }
  const u=(h-nh)/2;
  if(s==='w') return [[x+nh,y],[x+w,y],[x+w,y+h],[x+nh,y+h],[x+nh,y+u+nh],[x,y+u+nh],[x,y+u],[x+nh,y+u]];
  return [[x,y],[x+w-nh,y],[x+w-nh,y+u],[x+w,y+u],[x+w,y+u+nh],[x+w-nh,y+u+nh],[x+w-nh,y+h],[x,y+h]];
}
/* T 形：主体 + 一侧居中凸出（附楼），t = 凸出方向
   ★ o 是绝对坐标，不能再加 y —— 加两次会让整块凸出体拉到 y+o 处（巨块压到别的楼上且不报错） */
function TG(x,y,w,h,aw,ah,t){
  if(t==='n'){ const o=x+(w-aw)/2; return [[x,y+ah],[o,y+ah],[o,y],[o+aw,y],[o+aw,y+ah],[x+w,y+ah],[x+w,y+h],[x,y+h]]; }
  if(t==='s'){ const o=x+(w-aw)/2; return [[x,y],[x+w,y],[x+w,y+h-ah],[o+aw,y+h-ah],[o+aw,y+h],[o,y+h],[o,y+h-ah],[x,y+h-ah]]; }
  if(t==='w'){ const o=y+(h-ah)/2; return [[x+aw,y],[x+w,y],[x+w,y+h],[x+aw,y+h],[x+aw,o+ah],[x,o+ah],[x,o],[x+aw,o]]; }
  const o=y+(h-ah)/2; return [[x,y],[x+w-aw,y],[x+w-aw,o],[x+w,o],[x+w,o+ah],[x+w-aw,o+ah],[x+w-aw,y+h],[x,y+h]];
}
function OCT(cx,cy,r){ const p=[]; for(let i=0;i<8;i++){ const a=Math.PI/4*i-Math.PI/8; p.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]); } return p; }
function CIR(cx,cy,r,n){ n=n||26; const p=[]; for(let i=0;i<n;i++){ const a=2*Math.PI*i/n; p.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]); } return p; }
/* 板式宿舍：主体长条 + n 个楼梯间凸出（北侧）+ 南侧阳台带 */
function DORM(x,y,w,h,n){
  const ps=[RC(x,y,w,h)], tw=30, th=15, st=w/(n+1);
  for(let i=1;i<=n;i++) ps.push(RC(x+st*i-tw/2, y-th+5, tw, th));
  ps.push(RC(x+7, y+h-4, w-14, 7));
  return ps;
}
/* 单元式板楼：南侧开 m 个凹口（阳台/单元分隔），返回单一多边形 */
function SLAB(x,y,w,h,m,nd,nw){
  nd = nd||10; nw = nw||24; m = m||3;
  const s = (w - m*nw)/(m+1);
  const p = [[x,y],[x+w,y],[x+w,y+h]];
  let cur = x+w;
  for(let i=0;i<m;i++){
    cur -= s;
    p.push([cur, y+h], [cur, y+h-nd], [cur-nw, y+h-nd], [cur-nw, y+h]);
    cur -= nw;
  }
  p.push([x, y+h]);
  return p;
}
/* 合院：正房(北) + 东西厢房 + 倒座(南)，中留天井 —— 返回 ps 数组 */
function CRT(x,y,w,h,ringW){
  const d = ringW || 26;
  const sx = d*0.86;                       /* 厢房进深略浅 */
  return [
    RC(x, y, w, d),                        /* 正房 */
    RC(x, y+h-d, w, d),                    /* 倒座 */
    RC(x, y+d, sx, h-2*d),                 /* 西厢 */
    RC(x+w-sx, y+d, sx, h-2*d)             /* 东厢 */
  ];
}
/* 工字形：南北两翼 + 中部连接体 */
function HSH(x,y,w,h,ww,wh){
  const o=(w-ww)/2;
  return [ RC(x, y, w, wh), RC(x, y+h-wh, w, wh), RC(x+o, y+wh, ww, h-2*wh) ];
}
/* 十字形 */
function CRUC(x,y,w,h,aw,ah){
  return [ RC(x+(w-aw)/2, y, aw, h), RC(x, y+(h-ah)/2, w, ah) ];
}
/* 阶梯体量：单一多边形，沿 dir 方向逐段向北退台 */
function STEP(x,y,w,h,n,dir,st){
  st = st||16; n = n||3;
  const L = w/n, p=[];
  if(dir==='e'){
    for(let i=0;i<n;i++){ p.push([x+i*L, y+i*st], [x+(i+1)*L, y+i*st]); }
    p.push([x+w, y+h], [x, y+h]);
  } else {
    for(let i=0;i<n;i++){ p.push([x+w-i*L, y+i*st], [x+w-(i+1)*L, y+i*st]); }
    p.push([x, y+h]);
  }
  return p;
}
/* 弧形（扇环）：观演/报告厅/看台 */
function FAN(cx,cy,r0,r1,a0,a1,n){
  n=n||14; const p=[];
  for(let i=0;i<=n;i++){ const a=a0+(a1-a0)*i/n; p.push([cx+r1*Math.cos(a), cy+r1*Math.sin(a)]); }
  for(let i=n;i>=0;i--){ const a=a0+(a1-a0)*i/n; p.push([cx+r0*Math.cos(a), cy+r0*Math.sin(a)]); }
  return p;
}

const SVGNS = 'http://www.w3.org/2000/svg';
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(20261001);
const fx = v => (+v).toFixed(1);
const poly = pts => pts.map(p=>fx(p[0])+','+fx(p[1])).join(' ');

/* 颜色明度微调：amt>0 提亮，<0 压暗 */
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  const f = v => Math.max(0, Math.min(255, Math.round(v + 255*amt)));
  const r=f((n>>16)&255), g=f((n>>8)&255), b=f(n&255);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
/* 同类型建筑三档色差 —— 避免整片校园只有两三种颜色 */
function injectBuildRules(t){
  let css = '';
  for(const k in t.types){
    const f0 = t.types[k][0], s0 = t.types[k][1];
    for(let v=0;v<3;v++){
      css += `.b-${k}.v${v}{fill:${shade(f0,(v-1)*0.055)};stroke:${s0}}`;
    }
  }
  let el = document.getElementById('dynbuild');
  if(!el){ el=document.createElement('style'); el.id='dynbuild'; document.head.appendChild(el); }
  el.textContent = css;
}

/* 建筑真实形体（用于 clipPath 裁剪屋顶图案） */
function clipGeom(b){
  const tf = b.r ? ` transform="rotate(${b.r} ${b.x+b.w/2} ${b.y+b.h/2})"` : '';
  if(b.ps) return b.ps.map(p=>`<polygon points="${poly(p)}"${tf}/>`).join('');
  if(b.p && b.hl && b.hl.length){
    const d = 'M ' + b.p.map(q=>fx(q[0])+' '+fx(q[1])).join(' L ') + ' Z '
            + b.hl.map(hh=>'M ' + hh.map(q=>fx(q[0])+' '+fx(q[1])).join(' L ') + ' Z').join(' ');
    return `<path d="${d}" clip-rule="evenodd"${tf}/>`;
  }
  if(b.p) return `<polygon points="${poly(b.p)}"${tf}/>`;
  return `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="2.5"${tf}/>`;
}

/* 中庭（挖空区）命中判定 */
function inHole(b, x, y, w, h){
  if(!b.hl) return false;
  return b.hl.some(H=>{
    const xs=H.map(q=>q[0]), ys=H.map(q=>q[1]);
    const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
    return x < x1 && x+w > x0 && y < y1 && y+h > y0;
  });
}

/* 屋顶类型 */
function roofType(b){
  if(b.rf) return b.rf;
  if(b.t==='hist'||b.t==='cult') return 'gable';   /* 坡屋顶：正脊 + 椽条 */
  if(b.t==='lab'||b.t==='gh')    return 'saw';     /* 锯齿 / 条形天窗 */
  return 'flat';                                   /* 平屋顶：女儿墙 + 设备 */
}

/* 屋顶构件（画在包围盒内，由 clipPath 裁到真实形体）
   ★ 组合形体逐块生成 —— 每块有各自的正脊，形体层次才读得出来 */
function roofPattern(b){
  if(b.ps && b.ps.length > 1){
    let s = '';
    for(const pp of b.ps){
      const xs = pp.map(q=>q[0]), ys = pp.map(q=>q[1]);
      const x0 = Math.min(...xs), y0 = Math.min(...ys);
      s += roofBox(b, x0, y0, Math.max(...xs)-x0, Math.max(...ys)-y0);
    }
    return s;
  }
  return roofBox(b, b.x, b.y, b.w, b.h);
}

function roofBox(b, x, y, w, h){
  if(w < 12 || h < 12) return '';
  const t = roofType(b);
  /* 小体量的檐口内缩要按比例收 —— 固定 7 会算出负宽（SVG 静默丢图元） */
  const P = Math.min(7, Math.min(w,h)*0.20);
  const r = mulberry32(Math.round(b.i*7919 + x*13 + y*29) + 13);
  const horiz = w >= h, half = horiz ? h/2 : w/2;
  let s = '';

  if(t==='gable'){
    /* 两坡分色：受光侧提亮、背光侧压暗 —— 平面图上立刻读成"坡屋顶" */
    if(horiz){
      s += `<rect class="rf-a" x="${fx(x)}" y="${fx(y)}" width="${fx(w)}" height="${fx(half)}"/>`;
      s += `<rect class="rf-b" x="${fx(x)}" y="${fx(y+half)}" width="${fx(w)}" height="${fx(half)}"/>`;
    } else {
      s += `<rect class="rf-a" x="${fx(x)}" y="${fx(y)}" width="${fx(half)}" height="${fx(h)}"/>`;
      s += `<rect class="rf-b" x="${fx(x+half)}" y="${fx(y)}" width="${fx(half)}" height="${fx(h)}"/>`;
    }
    /* 瓦垄：自檐口指向正脊的短垄线 */
    if(Math.min(w,h) >= 28){
      if(horiz){
        const n = Math.max(2, Math.floor((w-2*P)/13));
        for(let i=1;i<n;i++){
          const px = x+P+(w-2*P)*i/n;
          s += `<line class="rf-raf" x1="${fx(px)}" y1="${fx(y+2)}" x2="${fx(px)}" y2="${fx(y+half-2)}"/>`
             + `<line class="rf-raf" x1="${fx(px)}" y1="${fx(y+half+2)}" x2="${fx(px)}" y2="${fx(y+h-2)}"/>`;
        }
      } else {
        const n = Math.max(2, Math.floor((h-2*P)/13));
        for(let i=1;i<n;i++){
          const py = y+P+(h-2*P)*i/n;
          s += `<line class="rf-raf" x1="${fx(x+2)}" y1="${fx(py)}" x2="${fx(x+half-2)}" y2="${fx(py)}"/>`
             + `<line class="rf-raf" x1="${fx(x+half+2)}" y1="${fx(py)}" x2="${fx(x+w-2)}" y2="${fx(py)}"/>`;
        }
      }
    }
    /* 檐口内缩线 + 正脊 */
    s += `<rect class="rf-eave" x="${fx(x+P*.6)}" y="${fx(y+P*.6)}" width="${fx(w-P*1.2)}" height="${fx(h-P*1.2)}"/>`;
    if(horiz) s += `<line class="rf-ridge" x1="${fx(x+1)}" y1="${fx(y+half)}" x2="${fx(x+w-1)}" y2="${fx(y+half)}"/>`;
    else      s += `<line class="rf-ridge" x1="${fx(x+half)}" y1="${fx(y+1)}" x2="${fx(x+half)}" y2="${fx(y+h-1)}"/>`;

  } else if(t==='saw'){
    /* 锯齿天窗：细斜向采光条，不是粗三角 —— 粗三角一眼假 */
    s += `<rect class="rf-parapet" x="${fx(x+P*.6)}" y="${fx(y+P*.6)}" width="${fx(w-P*1.2)}" height="${fx(h-P*1.2)}"/>`;
    let d = '';
    if(horiz){
      const n = Math.max(2, Math.round((w-2*P)/30)), cw = (w-2*P)/n;
      const yb = y+h-P, yt = y+P;
      for(let i=0;i<n;i++){
        const x0 = x+P+i*cw;
        d += `M ${fx(x0+cw*.06)} ${fx(yb)} L ${fx(x0+cw*.30)} ${fx(yt)} L ${fx(x0+cw*.46)} ${fx(yt)} L ${fx(x0+cw*.22)} ${fx(yb)} Z `;
      }
    } else {
      const n = Math.max(2, Math.round((h-2*P)/30)), ch = (h-2*P)/n;
      const xb = x+w-P, xt = x+P;
      for(let i=0;i<n;i++){
        const y0 = y+P+i*ch;
        d += `M ${fx(xb)} ${fx(y0+ch*.06)} L ${fx(xt)} ${fx(y0+ch*.30)} L ${fx(xt)} ${fx(y0+ch*.46)} L ${fx(xb)} ${fx(y0+ch*.22)} Z `;
      }
    }
    s += `<path class="rf-saw" d="${d}"/>`;

  } else {
    /* 平屋顶：女儿墙双线 + 分格缝 + 设备块 + 屋顶楼梯间 */
    s += `<rect class="rf-parapet"  x="${fx(x+P*.55)}" y="${fx(y+P*.55)}" width="${fx(w-P*1.1)}" height="${fx(h-P*1.1)}"/>`;
    s += `<rect class="rf-parapet2" x="${fx(x+P*1.7)}"  y="${fx(y+P*1.7)}"  width="${fx(w-P*3.4)}" height="${fx(h-P*3.4)}"/>`;
    if(Math.min(w,h) >= 52){
      for(let px=x+48; px<x+w-10; px+=48)
        s += `<line class="rf-grid" x1="${fx(px)}" y1="${fx(y+P*1.8)}" x2="${fx(px)}" y2="${fx(y+h-P*1.8)}"/>`;
      for(let py=y+48; py<y+h-10; py+=48)
        s += `<line class="rf-grid" x1="${fx(x+P*1.8)}" y1="${fx(py)}" x2="${fx(x+w-P*1.8)}" y2="${fx(py)}"/>`;
    }
    /* 屋顶楼梯间 / 机房（每栋都有，位置由种子决定） */
    if(Math.min(w,h) >= 34){
      const sw = 15+r()*7, sh = 13+r()*6;
      const sx = x+P+6 + r()*Math.max(1, w-2*P-sw-12);
      const sy = y+P+6 + r()*Math.max(1, h-2*P-sh-12);
      if(!inHole(b, sx, sy, sw, sh)){
        s += `<rect class="rf-stair" x="${fx(sx)}" y="${fx(sy)}" width="${fx(sw)}" height="${fx(sh)}" rx="1"/>`;
        s += `<line class="rf-raf" x1="${fx(sx)}" y1="${fx(sy+sh/2)}" x2="${fx(sx+sw)}" y2="${fx(sy+sh/2)}"/>`;
      }
    }
    /* 屋面设备块（冷却塔 / 水箱 / 光伏） */
    const nU = Math.max(1, Math.min(5, Math.round(w*h/9000)));
    for(let i=0;i<nU;i++){
      const uw = 13+r()*18, uh = 10+r()*12;
      const ux = x+P+5 + r()*Math.max(1, w-2*P-uw-10);
      const uy = y+P+5 + r()*Math.max(1, h-2*P-uh-10);
      if(inHole(b, ux, uy, uw, uh)) continue;      /* 不落进中庭 */
      s += `<rect class="rf-unit" x="${fx(ux)}" y="${fx(uy)}" width="${fx(uw)}" height="${fx(uh)}" rx="1.5"/>`;
    }
  }
  return s;
}

function buildingSVG(b){
  if(b.t==='plaza') return plazaSVG(b);
  if(b.t==='park')  return parkSVG(b);
  const cls = 'bl b-'+b.t+' v'+(b.i%3);
  const cx = b.x+b.w/2, cy = b.y+b.h/2;
  const tf = b.r ? ` transform="rotate(${b.r} ${cx} ${cy})"` : '';
  const lv = b.f>=5 ? 3 : (b.f>=3 ? 2 : 1);      /* 层数越高，落影越长 */
  let body = '';
  if(b.ps){
    body = b.ps.map((pp,ix)=>`<polygon class="${ix?'anx':''}" points="${poly(pp)}"/>`).join('');
  } else if(b.p){
    if(b.hl && b.hl.length){
      const d = 'M ' + b.p.map(q=>fx(q[0])+' '+fx(q[1])).join(' L ') + ' Z '
              + b.hl.map(hh=>'M ' + hh.map(q=>fx(q[0])+' '+fx(q[1])).join(' L ') + ' Z').join(' ');
      body = `<path d="${d}" fill-rule="evenodd"/>`;
    } else body = `<polygon points="${poly(b.p)}"/>`;
  } else {
    body = `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="2.5"/>`;
  }
  const roof = b.flat ? '' :
    `<g class="rooflayer" clip-path="url(#cp${b.i})" pointer-events="none">${roofPattern(b)}</g>`;
  const mark = b.flat
    ? `<line x1="${fx(b.x+4)}" y1="${fx(b.y+b.h/2)}" x2="${fx(b.x+b.w-4)}" y2="${fx(b.y+b.h/2)}" stroke-width="2.4" opacity=".55"/>`
    : '';
  return `<g class="${cls}" data-id="${b.i}" filter="url(#sh${lv})"${tf}>${body}${roof}${mark}</g>`;
}
function plazaSVG(b){
  if(b.p){                                   /* 圆形纪念广场 */
    const cx=b.x+b.w/2, cy=b.y+b.h/2, r=Math.min(b.w,b.h)/2;
    let s = `<circle cx="${fx(cx)}" cy="${fx(cy)}" r="${fx(r)}" fill="var(--m-plaza)" stroke="var(--m-plazaEdge)" stroke-width="1.3" data-id="${b.i}"/>`;
    for(const k of [0.86,0.68]) s += `<circle cx="${fx(cx)}" cy="${fx(cy)}" r="${fx(r*k)}" fill="none" stroke="var(--m-plazaEdge)" stroke-width="1" opacity=".65"/>`;
    s += `<circle cx="${fx(cx)}" cy="${fx(cy)}" r="${fx(r*0.22)}" fill="var(--b-hist-f)" stroke="var(--b-hist-s)" stroke-width="1.3"/>`;
    return s;
  }
  let s = `<rect class="plz" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="6" data-id="${b.i}"/>`;
  if(b.n==='馆前广场'){
    const cx=b.x+b.w/2, cy=b.y+b.h/2;
    s += `<circle cx="${cx}" cy="${cy}" r="32" fill="var(--m-water)" stroke="var(--m-waterEdge)" stroke-width="1.2"/>`;
    s += `<circle cx="${cx}" cy="${cy}" r="13" fill="var(--m-plaza)" stroke="var(--m-plazaEdge)" stroke-width="1"/>`;
  }
  return s;
}
function parkSVG(b){
  let s = `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="6" fill="var(--m-plaza)" stroke="var(--m-plazaEdge)" stroke-width="1" data-id="${b.i}"/>`;
  const cols = Math.floor(b.w/34), rows = Math.floor(b.h/34);
  for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){
    s += `<rect x="${fx(b.x+8+i*34)}" y="${fx(b.y+8+j*34)}" width="22" height="20" rx="2" fill="none" stroke="var(--m-plazaEdge)" stroke-width="1.4"/>`;
  }
  return s;
}
function courtSVG(b){
  const {x,y,w,h} = b, k = b.k;
  const col = 'var(--m-'+k+')';
  const stroke = 'rgba(255,255,255,.78)';
  let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${k==='track'?h/2:3}" fill="${col}" data-id="${b.i}"/>`;
  if(k==='track'){
    s += `<rect x="${x+16}" y="${y+16}" width="${w-32}" height="${h-32}" rx="${(h-32)/2}" fill="none" stroke="${stroke}" stroke-width="1.4"/>`;
    /* 西侧看台：三道同心台阶弧 */
    const cx0=x+w/2, cy0=y+h/2, rx0=(w-68)/2+6, ry0=(h-68)/2+6;
    for(let i=0;i<3;i++){
      const rx=rx0+i*6, ry=ry0+i*6;
      s += `<path d="M ${fx(cx0)} ${fx(cy0-ry)} A ${fx(rx)} ${fx(ry)} 0 0 0 ${fx(cx0)} ${fx(cy0+ry)}" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="5.5"/>`;
    }
    s += `<rect x="${x+34}" y="${y+34}" width="${w-68}" height="${h-68}" rx="${(h-68)/2}" fill="var(--m-field)" stroke="${stroke}" stroke-width="1.2"/>`;
    s += `<line x1="${x+w/2}" y1="${y+34}" x2="${x+w/2}" y2="${y+h-34}" stroke="${stroke}" stroke-width="1.2"/>`;
    s += `<circle cx="${x+w/2}" cy="${y+h/2}" r="26" fill="none" stroke="${stroke}" stroke-width="1.2"/>`;
  } else if(k==='bball'||k==='volley'){
    s += `<line x1="${x+w/2}" y1="${y+5}" x2="${x+w/2}" y2="${y+h-5}" stroke="${stroke}" stroke-width="1.2"/>`;
    s += `<rect x="${x+7}" y="${y+h/2-16}" width="20" height="32" fill="none" stroke="${stroke}" stroke-width="1.1"/>`;
    s += `<rect x="${x+w-27}" y="${y+h/2-16}" width="20" height="32" fill="none" stroke="${stroke}" stroke-width="1.1"/>`;
    if(k==='bball') s += `<circle cx="${x+w/2}" cy="${y+h/2}" r="13" fill="none" stroke="${stroke}" stroke-width="1.1"/>`;
  } else if(k==='tennis'){
    s += `<line x1="${x+w/2}" y1="${y+5}" x2="${x+w/2}" y2="${y+h-5}" stroke="${stroke}" stroke-width="1.1"/>`;
    s += `<rect x="${x+10}" y="${y+10}" width="${w-20}" height="${h-20}" fill="none" stroke="${stroke}" stroke-width="1.1"/>`;
  } else if(k==='football'){
    s += `<rect x="${x+12}" y="${y+10}" width="${w-24}" height="${h-20}" fill="none" stroke="${stroke}" stroke-width="1.2"/>`;
    s += `<line x1="${x+w/2}" y1="${y+10}" x2="${x+w/2}" y2="${y+h-10}" stroke="${stroke}" stroke-width="1.1"/>`;
    s += `<circle cx="${x+w/2}" cy="${y+h/2}" r="16" fill="none" stroke="${stroke}" stroke-width="1.1"/>`;
  }
  return s;
}

/* 树木散布 */
function treesSVG(){
  const out = [];
  for(const g of GROVES){
    for(let i=0;i<g.n;i++){
      const x = g.x + 10 + rnd()*(g.w-20);
      const y = g.y + 10 + rnd()*(g.h-20);
      if(inAvoid(x,y) || inWater(x,y)) continue;
      const r = 5 + rnd()*4.5;
      const c = rnd()<0.34 ? 'var(--m-tree3)' : 'var(--m-tree)';
      out.push(`<circle cx="${fx(x)}" cy="${fx(y)}" r="${fx(r)}" fill="${c}" stroke="var(--m-treeEdge)" stroke-width=".9"/>`);
    }
  }
  const lines = [[150,150,2250,150],[2250,150,2250,1350],[2250,1350,150,1350],[150,1350,150,150],[150,800,2250,800]];
  for(const L of lines){
    const dx=L[2]-L[0], dy=L[3]-L[1], len=Math.hypot(dx,dy);
    const steps = Math.floor(len/74);
    const nx = -dy/len, ny = dx/len;
    for(let i=1;i<steps;i++){
      const t=i/steps, px=L[0]+dx*t, py=L[1]+dy*t;
      for(const off of [-30,30]){
        const x=px+nx*off, y=py+ny*off;
        if(inAvoid(x,y)||inWater(x,y)) continue;
        if(x<140||x>2260||y<140||y>1360) continue;
        out.push(`<circle cx="${fx(x)}" cy="${fx(y)}" r="5.6" fill="var(--m-tree)" stroke="var(--m-treeEdge)" stroke-width=".9"/>`);
      }
    }
  }
  return out.join('');
}

/* 道路 */
function roadsSVG(){
  let s = '';
  const mk = (r,cls,w)=>`<polyline class="${cls}" points="${poly(r.p)}" fill="none" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
  for(const r of ROADS) s += mk(r, 'rd-case', r.w+7);
  for(const r of ROADS){
    s += mk(r, 'rd', r.w);
    if(r.main) s += `<polyline points="${poly(r.p)}" fill="none" stroke="var(--m-roadCase)" stroke-width="1.1" stroke-dasharray="14 12" stroke-linecap="round" opacity=".55"/>`;
  }
  for(const p of PATHS) s += mk(p, 'pt', p.w);
  for(const r of ROUNDABOUTS){
    s += `<circle cx="${r.x}" cy="${r.y}" r="${r.r+5}" fill="var(--m-roadCase)"/>`;
    s += `<circle cx="${r.x}" cy="${r.y}" r="${r.r}" fill="var(--m-road)"/>`;
    s += `<circle cx="${r.x}" cy="${r.y}" r="${r.ir}" fill="var(--m-lawn)" stroke="var(--m-lawnEdge)" stroke-width="1.2"/>`;
  }
  return s;
}

/* 标注 */
function labelsSVG(){
  const out = [];
  const put = (x,y,txt,cls,anchor,rot)=>{
    out.push(`<text x="${fx(x)}" y="${fx(y)}" class="lb ${cls||''}" text-anchor="${anchor||'middle'}"${rot?` transform="rotate(${rot} ${fx(x)} ${fx(y)})"`:''}>${esc(txt)}</text>`);
  };
  /* 分区大字（低透明度底纹，置于各分区相对空旷处） */
  const ZL = [
    ['历史风貌区', 542, 314],   ['图书馆区', 389, 632],     ['实验楼群', 880, 632],
    ['教工小院区', 1395, 468],  ['教学主楼区', 1970, 314],  ['学生生活区', 1970, 632],
    ['公共教学区', 389, 968], ['农业工程区', 880, 968],   ['湖滨景观区', 1395, 968],
    ['体育运动区', 1970, 968],  ['资源环境区', 389, 1276],  ['实训基地', 880, 1276],
    ['植物园 · 食品区', 1395, 1276], ['学生生活区', 1970, 1276],
  ];
  for(const z of ZL) put(z[1], z[2], z[0], 'zl');
  /* 路名 */
  put(900, 796, '中 轴 大 道', 'lb-road');
  put(560, 143, '环 校 北 路', 'lb-road');
  put(620, 560, '崇文路', 'lb-road', 'middle', -90);
  put(1140, 560, '学府路', 'lb-road', 'middle', -90);
  put(1650, 560, '致远路', 'lb-road', 'middle', -90);
  put(2282, 1180, '环 校 东 路', 'lb-road', 'middle', -90);
  /* 建筑名 —— 一律置于建筑外侧上方，避免压住屋顶构件 */
  for(const b of BUILDINGS){
    if(!b.lb) continue;
    const cx = b.x+b.w/2, cy = b.y+b.h/2;
    if(b.t==='court' || b.t==='park'){ put(cx, cy+4, b.n, 'lb-sm'); continue; }
    if(b.t==='green'){ put(cx, b.y+26, b.n, 'lb-lg'); continue; }
    if(b.t==='plaza'){ put(cx, cy+4, b.n, 'lb-sm'); continue; }
    const big = b.w>=190 && b.h>=96;
    if(big) put(cx, cy+5, b.n, 'lb');
    else put(cx, b.y-7, b.n, b.w<120 ? 'lb-sm' : 'lb');
  }
  /* 校门 */
  for(const g of GATES){
    if(g.dir==='W') put(g.x+16, g.y-14, g.n, 'lb-gate','start');
    else if(g.dir==='E') put(g.x-16, g.y-14, g.n, 'lb-gate','end');
    else if(g.dir==='N') put(g.x, g.y+30, g.n, 'lb-gate');
    else put(g.x, g.y-16, g.n, 'lb-gate');
  }
  return out.join('');
}

function buildMap(){
  const svg = document.getElementById('map');
  BUILDINGS.forEach((b,i)=>b.i=i);

  const bg = `<rect x="-200" y="-200" width="2800" height="1900" fill="var(--m-out)"/>`;
  let ctx = '';
  for(let i=-1;i<6;i++){
    ctx += `<line x1="-200" y1="${-60+i*330}" x2="2600" y2="${-60+i*330}" stroke="var(--m-outRoad)" stroke-width="14" opacity=".8"/>`;
    ctx += `<line x1="${-90+i*500}" y1="-200" x2="${-90+i*500}" y2="1700" stroke="var(--m-outRoad)" stroke-width="14" opacity=".8"/>`;
  }
  ctx += `<path d="M -200 1420 C 300 1380 500 1470 900 1440 C 1300 1410 1600 1478 2000 1445 C 2300 1420 2450 1460 2600 1440 L 2600 1700 L -200 1700 Z" fill="var(--m-water)" opacity=".55"/>`;

  const land = `<rect x="120" y="120" width="2160" height="1260" rx="46" fill="var(--m-land)" stroke="var(--m-landEdge)" stroke-width="2.5"/>`;

  let zone = '';
  for(const z of ZONES) zone += `<rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="14" fill="var(--z-${z.z})" opacity=".13"/>`;

  let green = '';
  for(const g of GROVES) green += `<rect x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" rx="20" fill="var(--m-lawn)" opacity=".72"/>`;
  for(const b of BUILDINGS) if(b.t==='green'){
    if(b.n==='百草园'){
      const cx=b.x+b.w/2, cy=b.y+b.h/2, r=Math.min(b.w,b.h)/2;
      green += `<circle cx="${fx(cx)}" cy="${fx(cy)}" r="${fx(r)}" fill="var(--m-lawn)" stroke="var(--m-lawnEdge)" stroke-width="1.4"/>`;
      for(let i=0;i<12;i++){
        const a=Math.PI*2*i/12;
        green += `<line x1="${fx(cx)}" y1="${fx(cy)}" x2="${fx(cx+r*Math.cos(a))}" y2="${fx(cy+r*Math.sin(a))}" stroke="var(--m-path)" stroke-width="2.6" opacity=".85"/>`;
      }
      green += `<circle cx="${fx(cx)}" cy="${fx(cy)}" r="${fx(r*0.32)}" fill="var(--m-plaza)" stroke="var(--m-plazaEdge)" stroke-width="1.2"/>`;
    } else {
      green += `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="22" fill="var(--m-lawn)" stroke="var(--m-lawnEdge)" stroke-width="1.4" stroke-dasharray="7 5"/>`;
    }
  }

  let water = '';
  for(const w of WATER) water += `<path d="${w.d}" fill="var(--m-water)" stroke="var(--m-waterEdge)" stroke-width="1.6"/>`;
  water += `<path d="M 1192 900 C 1186 852 1240 818 1330 816 C 1420 814 1486 842 1494 892 C 1502 946 1444 1014 1352 1026 C 1260 1038 1200 976 1192 900 Z" fill="var(--m-water2)" opacity=".45"/>`;
  water += `<ellipse cx="1375" cy="872" rx="58" ry="40" fill="var(--m-lawn)" stroke="var(--m-lawnEdge)" stroke-width="1.2"/>`;
  water += `<rect x="1352" y="908" width="46" height="11" rx="5" fill="var(--m-plaza)" stroke="var(--m-plazaEdge)" stroke-width="1"/>`;
  /* 荷花池荷叶点缀 */
  for(const p of [[1238,1258],[1270,1276],[1244,1296],[1288,1246],[1302,1288]])
    water += `<circle cx="${p[0]}" cy="${p[1]}" r="${5+((p[0]*7)%4)}" fill="var(--m-lawn)" opacity=".55"/>`;

  /* 建筑：先建 clipPath 定义，再渲染 */
  let defs = '', plazas = '', courts = '', builds = '';
  for(const b of BUILDINGS){
    if(b.t==='court'){ courts += courtSVG(b); continue; }
    if(b.t==='green') continue;
    if(b.t==='plaza'||b.t==='park'){ plazas += buildingSVG(b); continue; }
    defs  += `<clipPath id="cp${b.i}">${clipGeom(b)}</clipPath>`;
    builds += buildingSVG(b);
  }

  let gates = '';
  for(const g of GATES){
    const w = g.dir==='N'||g.dir==='S' ? 46 : 12, h = g.dir==='N'||g.dir==='S' ? 12 : 46;
    gates += `<rect x="${fx(g.x-w/2)}" y="${fx(g.y-h/2)}" width="${w}" height="${h}" rx="3" fill="var(--b-admin-f)" stroke="var(--b-admin-s)" stroke-width="1.6"/>`;
    gates += `<circle cx="${g.x}" cy="${g.y}" r="4" fill="#E0A458"/>`;
  }

  let walls = '';
  for(const w of WALLS) walls += `<polyline class="wall" points="${poly(w.p)}"/>`;

  svg.innerHTML =
    `<defs>
       <filter id="sh1" x="-45%" y="-45%" width="210%" height="210%">
         <feDropShadow dx="-4" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.20"/>
       </filter>
       <filter id="sh2" x="-45%" y="-45%" width="210%" height="210%">
         <feDropShadow dx="-6" dy="8" stdDeviation="5" flood-color="#000" flood-opacity="0.22"/>
       </filter>
       <filter id="sh3" x="-45%" y="-45%" width="210%" height="210%">
         <feDropShadow dx="-8" dy="11" stdDeviation="6.5" flood-color="#000" flood-opacity="0.24"/>
       </filter>
       <filter id="shH" x="-45%" y="-45%" width="210%" height="210%">
         <feDropShadow dx="-3" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.34"/>
         <feDropShadow dx="-10" dy="14" stdDeviation="9" flood-color="#000" flood-opacity="0.20"/>
       </filter>
       ${defs}
     </defs>
     <g id="vp">
       <g id="gCtx">${bg}${ctx}</g>
       <g id="gLand">${land}</g>
       <g id="gZone" style="display:none">${zone}</g>
       <g id="gGreen">${green}</g>
       <g id="gWater">${water}</g>
       <g id="gRoad">${roadsSVG()}</g>
       <g id="gLink">${linkwaysSVG()}</g>
       <g id="gWall">${walls}</g>
       <g id="gPlaza">${plazas}</g>
       <g id="gCourt">${courts}</g>
       <g id="gTree">${treesSVG()}</g>
       <g id="gBuild">${builds}</g>
       <g id="gGate">${gates}</g>
       <g id="gLabel">${labelsSVG()}</g>
       <g id="gDecor">${decorSVG()}</g>
     </g>`;

  applyLayerStyles();
  bindBuildings();
  updateStat();
}

function decorSVG(){
  return `
  <g transform="translate(2232 1442)">
    <circle r="40" fill="var(--m-land)" stroke="var(--m-landEdge)" stroke-width="2" opacity=".92"/>
    <path d="M 0 -26 L 9 12 L 0 5 L -9 12 Z" fill="var(--m-label)"/>
    <text y="30" text-anchor="middle" class="lb-n" style="font-size:15px">N</text>
  </g>`;
}

function applyLayerStyles(){
  const set=(id,on)=>{const e=document.getElementById(id); if(e) e.style.display = on?'':'none';};
  set('gBuild', LAYERS.build);
  set('gGreen', LAYERS.green);
  set('gWater', LAYERS.water);
  set('gRoad',  LAYERS.road);
  set('gLabel', LAYERS.label);
  set('gZone',  LAYERS.zone);
  set('gTree',  LAYERS.green && LAYERS.tree);
  set('gCourt', LAYERS.build);
  set('gPlaza', LAYERS.build);
  set('gGate',  LAYERS.build);
  set('gWall',  LAYERS.build);
}

function updateStat(){
  const n = BUILDINGS.filter(b=>b.t!=='court'&&b.t!=='plaza'&&b.t!=='park'&&b.t!=='green').length;
  const z = new Set(ZONES.map(z=>z.n)).size;
  document.getElementById('stat').textContent = `${n} 栋建筑 · ${z} 个功能分区 · 校园约 ${Math.round(2160*UNIT_M)} × ${Math.round(1260*UNIT_M)} m`;
}

/* ---------- 6. 交互 ---------- */
let view = {k:1, tx:0, ty:0};
const map = document.getElementById('map');
const stage = document.getElementById('stage');
const vp = () => document.getElementById('vp');

function applyView(){
  const v = vp(); if(!v) return;
  v.setAttribute('transform', `translate(${view.tx} ${view.ty}) scale(${view.k})`);
  const W = stage.clientWidth || 1;
  const px = (BAR_M / UNIT_M) * (W / 2400) * view.k;
  const bar = document.getElementById('scalebar');
  if(bar) bar.style.width = Math.max(28, Math.min(px, W - 60)) + 'px';
}
function clientToSvg(ev){
  const pt = map.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
  return pt.matrixTransform(map.getScreenCTM().inverse());
}
function zoomAt(sx, sy, factor){
  const k2 = Math.max(0.55, Math.min(6, view.k*factor));
  const ux = (sx - view.tx)/view.k, uy = (sy - view.ty)/view.k;
  view.tx = sx - k2*ux; view.ty = sy - k2*uy; view.k = k2;
  applyView();
}
function zoomCenter(factor){
  const r = map.getBoundingClientRect();
  const p = clientToSvg({clientX:r.left+r.width/2, clientY:r.top+r.height/2});
  zoomAt(p.x, p.y, factor);
}
map.addEventListener('wheel', e=>{
  e.preventDefault();
  const p = clientToSvg(e);
  zoomAt(p.x, p.y, e.deltaY<0 ? 1.14 : 1/1.14);
}, {passive:false});

let drag = null, lastMoved = 0;
stage.addEventListener('pointerdown', e=>{
  if(e.target.closest('.panel')) return;
  drag = {x:e.clientX, y:e.clientY, moved:0, cap:false, id:e.pointerId};
  stage.classList.add('dragging');
});
window.addEventListener('pointermove', e=>{
  if(!drag) return;
  const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
  drag.moved += Math.abs(dx)+Math.abs(dy);
  drag.x = e.clientX; drag.y = e.clientY;
  if(!drag.cap){
    if(drag.moved <= 7) return;
    drag.cap = true;
    try{ stage.setPointerCapture(drag.id); }catch(_){}
  }
  const p1 = clientToSvg({clientX:e.clientX-dx, clientY:e.clientY-dy});
  const p2 = clientToSvg(e);
  view.tx += (p2.x-p1.x); view.ty += (p2.y-p1.y);
  applyView();
});
const endDrag = ()=>{ lastMoved = drag ? drag.moved : 0; drag = null; stage.classList.remove('dragging'); };
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

const tip = document.getElementById('tip');
const drawer = document.getElementById('drawer');
function findB(id){ return BUILDINGS[+id]; }

function bindBuildings(){
  document.querySelectorAll('#vp [data-id]').forEach(el=>{
    el.style.cursor = 'pointer';
    el.addEventListener('pointerenter', ()=>{
      const b = findB(el.dataset.id);
      tip.textContent = b.n; tip.style.opacity = 1;
      el.classList.add('hov');
    });
    el.addEventListener('pointermove', ev=>{
      tip.style.left = (ev.clientX+14)+'px';
      tip.style.top  = (ev.clientY-30)+'px';
    });
    el.addEventListener('pointerleave', ()=>{ tip.style.opacity=0; el.classList.remove('hov'); });
    el.addEventListener('click', ()=>{
      if(lastMoved > 7) return;
      openCard(findB(el.dataset.id));
    });
  });
}
function openCard(b){
  document.getElementById('d-nm').textContent = b.n;
  const tp = b.t==='court' ? '运动场地' : (b.t==='plaza' ? '广场' : (b.t==='park' ? '停车场' : (TYPE_LABEL[b.t]||'其他')));
  const isSite = b.t==='court'||b.t==='plaza'||b.t==='park'||b.t==='green';
  const area = Math.round(b.w*b.h*AREA_M2);
  let h = `<div class="kv"><i>功能</i><b>${tp}</b></div>`;
  if(!isSite){
    h += `<div class="kv"><i>层数</i><b>${b.f} 层</b></div>`;
    h += `<div class="kv"><i>占地</i><b>${area.toLocaleString()} m²</b></div>`;
    h += `<div class="kv"><i>建面</i><b>≈ ${(area*b.f).toLocaleString()} m²</b></div>`;
  } else {
    h += `<div class="kv"><i>占地</i><b>${area.toLocaleString()} m²</b></div>`;
  }
  if(b.d) h += `<div style="margin-top:9px;color:#B9B7B1">${esc(b.d)}</div>`;
  h += `<span class="tag" style="background:var(--b-${b.t==='court'?'sport':b.t}-f);color:#2A2418;border:1px solid rgba(0,0,0,.15)">${tp}</span>`;
  document.getElementById('d-bd').innerHTML = h;
  drawer.classList.add('show');
}
document.getElementById('d-x').onclick = ()=> drawer.classList.remove('show');

/* 导出 PNG：把当前主题的 CSS 变量与图元规则内联进 SVG 再光栅化 */
function cssForExport(){
  const cs = getComputedStyle(document.documentElement);
  const keys = ['m-bg','m-land','m-landEdge','m-out','m-outRoad','m-lawn','m-lawnEdge','m-tree','m-treeEdge',
    'm-tree3','m-water','m-water2','m-waterEdge','m-road','m-roadCase','m-path','m-plaza','m-plazaEdge','m-wall',
    'm-label','m-sub','m-halo','m-bball','m-volley','m-tennis','m-football','m-track','m-field'];
  for(const k in TYPE_LABEL) keys.push('b-'+k+'-f','b-'+k+'-s');
  for(const k in TH.zones)   keys.push('z-'+k);
  const vars = keys.map(k=>'--'+k+':'+cs.getPropertyValue('--'+k).trim()).join(';');
  const font = 'font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
  let rules = '';
  for(const sheet of document.styleSheets){
    let list; try{ list = sheet.cssRules; }catch(_){ continue; }
    for(const r of list){
      const t = r.cssText || '';
      if(/^\.(bl|b-[a-z]+|lb|zl|plz|rd|pt|rf-|wall|anx|rooflayer)/.test(t)) rules += t;
    }
  }
  return `:root{${vars};${font}}${rules}`;
}
function exportPNG(){
  const S = 1.6, W = 2400, H = 1500;
  const clone = document.getElementById('map').cloneNode(true);
  const g = clone.querySelector('#vp'); if(g) g.setAttribute('transform','translate(0 0) scale(1)');
  clone.setAttribute('xmlns', SVGNS);
  clone.setAttribute('width', W); clone.setAttribute('height', H);
  const st = document.createElementNS(SVGNS,'style');
  st.textContent = cssForExport();
  clone.insertBefore(st, clone.firstChild);
  const data = new XMLSerializer().serializeToString(clone);
  const img = new Image();
  img.onload = ()=>{
    const cv = document.createElement('canvas');
    cv.width = W*S; cv.height = H*S;
    const cx = cv.getContext('2d');
    cx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--m-bg').trim() || '#fff';
    cx.fillRect(0,0,cv.width,cv.height);
    cx.drawImage(img,0,0,cv.width,cv.height);
    cv.toBlob(bl=>{
      const a = document.createElement('a');
      a.href = URL.createObjectURL(bl);
      a.download = '校园总平面图_' + THEME_KEY + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    }, 'image/png');
  };
  img.onerror = ()=> console.error('SVG 光栅化失败');
  img.src = 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(data);
}

/* 搜索 */
document.getElementById('q').addEventListener('input', e=>{
  const q = e.target.value.trim();
  document.querySelectorAll('#vp [data-id]').forEach(el=> el.classList.remove('hit','dim'));
  if(!q) return;
  let first = null;
  BUILDINGS.forEach(b=>{
    const hit = b.n.includes(q) || (TYPE_LABEL[b.t]||'').includes(q);
    if(!hit) return;
    const el = document.querySelector(`#vp [data-id="${b.i}"]`);
    if(el){ el.classList.add('hit'); if(!first) first = b; }
  });
  if(first) openCard(first);
});

/* 按钮 */
document.getElementById('tools').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  const a = b.dataset.act;
  if(a==='in') zoomCenter(1.25);
  else if(a==='out') zoomCenter(1/1.25);
  else if(a==='reset'){ view={k:1,tx:0,ty:0}; applyView(); }
  else if(a==='png') exportPNG();
  else if(b.dataset.l){ LAYERS[b.dataset.l] = LAYERS[b.dataset.l]?0:1; b.classList.toggle('on'); applyLayerStyles(); }
  else if(b.dataset.t){ applyTheme(b.dataset.t); }
});

/* ---------- 7. 初始化 UI ---------- */
(function initUI(){
  const ly = [['build','建筑'],['green','绿地'],['water','水系'],['road','道路'],['label','标注'],['zone','分区']];
  document.getElementById('layers').innerHTML = ly.map(([k,n])=>
    `<button class="btn ${LAYERS[k]?'on':''}" data-l="${k}">${n}</button>`).join('');
  document.getElementById('themes').innerHTML = Object.keys(THEMES).map(k=>
    `<button class="btn ${k==='paper'?'on':''}" data-t="${k}">${THEMES[k].label}</button>`).join('');

  const lg = Object.keys(TYPE_LABEL);
  document.getElementById('lgbody').innerHTML = lg.map(k=>
    `<div class="it"><span class="sw" style="background:var(--b-${k}-f);border-color:var(--b-${k}-s)"></span>${TYPE_LABEL[k]}</div>`
  ).join('') + `
    <div class="it"><span class="sw" style="background:var(--m-water)"></span>水域</div>
    <div class="it"><span class="sw" style="background:var(--m-lawn)"></span>绿地</div>
    <div class="it"><span class="sw" style="background:var(--m-road)"></span>道路</div>
    <div class="it"><span class="sw" style="background:var(--m-plaza)"></span>铺装广场</div>`;

  document.getElementById('scaletxt').textContent = BAR_M + ' m';
})();

setTimeout(()=>document.getElementById('hint').classList.add('off'), 5200);

/* ---------- 8. 启动 ---------- */
applyTheme('paper');
buildMap();
applyView();
window.addEventListener('resize', applyView);
</script>
