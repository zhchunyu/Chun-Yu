<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山河大学 · 全园模型预览（GLB）</title>
<!-- 空 data: favicon —— 不设的话浏览器会去要 /favicon.ico，控制台多一条 404 -->
<link rel="icon" href="data:,">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>
<style>
:root{
  --ink:#2B2E33; --paper:#E8E6E0; --wood:#C9A87C; --cu:#B07B45;
  --glass:rgba(20,24,28,.62); --line:rgba(232,230,224,.16);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e1216;
  font:13px/1.6 "PingFang SC","Microsoft YaHei","Source Han Sans SC",sans-serif;color:var(--paper)}
#scene{display:block;width:100%;height:100%}

.panel{position:fixed;background:var(--glass);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:4px}

/* 左上：标题 + 模型统计 */
#head{left:18px;top:18px;padding:14px 18px 13px;max-width:330px}
#head h1{margin:0 0 2px;font-size:15px;font-weight:700;letter-spacing:.05em}
#head h1 em{font-style:normal;color:var(--cu)}
#head .sub{color:rgba(232,230,224,.55);font-size:11.5px;letter-spacing:.02em}
#head dl{margin:11px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;
  font-family:ui-monospace,Consolas,monospace;font-size:11.5px}
#head dt{color:rgba(232,230,224,.5)}
#head dd{margin:0;text-align:right}

/* 右上：运行统计 */
#stats{right:18px;top:18px;padding:11px 15px;font-family:ui-monospace,Consolas,monospace;
  font-size:11.5px;line-height:1.9;min-width:150px}
#stats b{color:var(--wood);font-weight:600}
#stats .row{display:flex;justify-content:space-between;gap:14px}
#stats .row span{color:rgba(232,230,224,.5)}

/* 底部：相机预设 */
#presets{left:50%;transform:translateX(-50%);bottom:18px;padding:9px 10px;
  display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:min(92vw,860px)}
#presets button{appearance:none;border:1px solid var(--line);background:transparent;
  color:rgba(232,230,224,.78);font:inherit;font-size:12px;padding:6px 13px;
  border-radius:3px;cursor:pointer;transition:.16s;white-space:nowrap}
#presets button:hover{border-color:var(--wood);color:var(--paper)}
#presets button.on{background:var(--cu);border-color:var(--cu);color:#1a1207;font-weight:600}

/* 右下：操作提示 */
#hint{right:18px;bottom:18px;padding:9px 14px;font-size:11.5px;
  color:rgba(232,230,224,.55);line-height:1.8}
#hint kbd{font-family:ui-monospace,Consolas,monospace;color:var(--wood)}

/* 隐藏不需要的 UI 元素 */
#head,#presets,#hint{display:none!important}

/* 右侧：AI 导航面板 */
#nav-panel{right:18px;top:18px;width:300px;padding:0;overflow:hidden}
#nav-panel .nav-head{display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px 10px;border-bottom:1px solid var(--line)}
#nav-panel .nav-head h1{margin:0;font-size:14px;font-weight:700;letter-spacing:.04em}
#nav-panel .nav-head h1 em{font-style:normal;color:var(--cu)}
#nav-panel .nav-head button{appearance:none;border:none;background:transparent;
  color:rgba(232,230,224,.5);font-size:18px;cursor:pointer;line-height:1;padding:0 4px}
#nav-panel .nav-head button:hover{color:var(--paper)}
#nav-panel .nav-body{padding:14px 16px}

.nav-tabs{display:flex;gap:4px;margin-bottom:12px;background:rgba(255,255,255,.04);
  border-radius:4px;padding:3px}
.nav-tab{flex:1;padding:6px 8px;text-align:center;font-size:12px;cursor:pointer;
  border-radius:3px;color:rgba(232,230,224,.6);transition:.16s}
.nav-tab.on{background:var(--cu);color:#1a1207;font-weight:600}
.nav-tab:hover:not(.on){color:var(--paper)}

.nav-field{margin-bottom:10px}
.nav-field label{display:block;font-size:11.5px;color:rgba(232,230,224,.55);
  margin-bottom:5px;letter-spacing:.02em}
.nav-input-wrap{position:relative}
.nav-input-wrap input{width:100%;appearance:none;border:1px solid var(--line);
  background:rgba(255,255,255,.04);color:var(--paper);font:inherit;font-size:13px;
  padding:8px 10px;border-radius:4px;outline:none;transition:.16s}
.nav-input-wrap input:focus{border-color:var(--cu);background:rgba(255,255,255,.06)}
.suggest-list{position:absolute;top:100%;left:0;right:0;max-height:180px;overflow-y:auto;
  background:var(--glass);border:1px solid var(--line);border-top:none;border-radius:0 0 4px 4px;
  z-index:10;backdrop-filter:blur(14px)}
.suggest-list.hidden{display:none}
.suggest-item{padding:7px 10px;font-size:12.5px;cursor:pointer;
  color:rgba(232,230,224,.8);transition:.1s}
.suggest-item:hover,.suggest-item.active{background:rgba(176,123,69,.2);color:var(--paper)}

.nav-btn{width:100%;appearance:none;border:none;border-radius:4px;
  background:linear-gradient(135deg,var(--cu),#d4a065);color:#1a1207;
  font:inherit;font-size:13px;font-weight:600;padding:10px;cursor:pointer;
  transition:.16s;letter-spacing:.04em;margin-top:4px}
.nav-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(176,123,69,.3)}
.nav-btn:active{transform:translateY(0)}
.nav-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

.nav-ai-input-wrap{position:relative}
.nav-ai-input-wrap textarea{width:100%;appearance:none;border:1px solid var(--line);
  background:rgba(255,255,255,.04);color:var(--paper);font:inherit;font-size:13px;
  padding:10px;border-radius:4px;outline:none;transition:.16s;resize:none;
  min-height:80px;line-height:1.6}
.nav-ai-input-wrap textarea:focus{border-color:var(--cu);background:rgba(255,255,255,.06)}

.nav-ai-status{display:flex;align-items:center;gap:6px;font-size:11.5px;
  color:rgba(232,230,224,.5);margin-top:8px}
.nav-ai-status .dot{width:6px;height:6px;border-radius:50%;background:#4caf50}
.nav-ai-btn{display:inline-flex;align-items:center;gap:4px;margin-left:auto;
  font-size:11px;color:var(--cu);background:transparent;border:none;cursor:pointer;
  padding:0;font:inherit;text-decoration:underline}

/* 导航结果 */
#nav-result{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
#nav-result.hidden{display:none}
.nr-title{font-size:12.5px;font-weight:600;margin-bottom:8px;color:var(--wood)}
.nr-info{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:12px;
  margin-bottom:8px}
.nr-info .k{color:rgba(232,230,224,.5)}
.nr-info .v{color:var(--paper);font-weight:500}
.nr-desc{font-size:12px;line-height:1.7;color:rgba(232,230,224,.75);
  background:rgba(255,255,255,.03);padding:8px 10px;border-radius:4px;
  border-left:2px solid var(--cu)}

/* AI 配置弹窗 */
#ai-config-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;z-index:30;
  backdrop-filter:blur(4px)}
#ai-config-modal.hidden{display:none}
.ai-config-box{background:rgba(20,24,28,.95);border:1px solid var(--line);
  border-radius:6px;padding:20px 22px;width:360px;max-width:90vw}
.ai-config-box h2{margin:0 0 14px;font-size:15px}
.ai-config-box .field{margin-bottom:12px}
.ai-config-box label{display:block;font-size:11.5px;color:rgba(232,230,224,.55);
  margin-bottom:5px}
.ai-config-box input{width:100%;appearance:none;border:1px solid var(--line);
  background:rgba(255,255,255,.04);color:var(--paper);font:inherit;font-size:13px;
  padding:8px 10px;border-radius:4px;outline:none}
.ai-config-box input:focus{border-color:var(--cu)}
.ai-config-btns{display:flex;gap:8px;margin-top:16px}
.ai-config-btns button{flex:1;padding:8px;border-radius:4px;border:none;
  cursor:pointer;font:inherit;font-size:13px}
.ai-config-btns .save{background:var(--cu);color:#1a1207;font-weight:600}
.ai-config-btns .cancel{background:transparent;color:rgba(232,230,224,.7);
  border:1px solid var(--line)}

/* 加载遮罩 */
#load{position:fixed;inset:0;background:#0e1216;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;z-index:20;transition:opacity .5s}
#load.done{opacity:0;pointer-events:none}
#load .t{font-size:14px;letter-spacing:.14em;color:rgba(232,230,224,.8)}
#load .bar{width:260px;height:2px;background:rgba(232,230,224,.14);overflow:hidden}
#load .bar i{display:block;height:100%;width:0;background:var(--cu);transition:width .25s}
#load .b{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:rgba(232,230,224,.45)}
#load .err{color:#e08a6a;max-width:520px;text-align:center;line-height:1.8;font-size:12.5px}
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div class="panel" id="head">
  <h1>山河大学 · <em>全园模型预览</em></h1>
  <div class="sub">R7 全园整合 · 规划调整 V3 定版 · 从 Blender 导出的 GLB</div>
  <dl>
    <dt>文件</dt><dd id="m-file">—</dd>
    <dt>大小</dt><dd id="m-size">—</dd>
    <dt>三角面</dt><dd id="m-tri">—</dd>
    <dt>网格 / 材质</dt><dd id="m-mesh">—</dd>
    <dt>加载耗时</dt><dd id="m-load">—</dd>
  </dl>
</div>

<div class="panel" id="stats">
  <div class="row"><span>FPS</span><b id="s-fps">—</b></div>
  <div class="row"><span>绘制面</span><b id="s-tri">—</b></div>
  <div class="row"><span>DrawCall</span><b id="s-call">—</b></div>
  <div class="row"><span>视距</span><b id="s-dist">—</b></div>
</div>

<div class="panel" id="presets"></div>

<div class="panel" id="hint">
  <kbd>拖拽</kbd> 旋转 · <kbd>滚轮</kbd> 缩放 · <kbd>右键</kbd> 平移<br>
  <kbd>1</kbd>–<kbd>7</kbd> 切预设 · <kbd>R</kbd> 自动旋转
</div>

<!-- 右侧：AI 导航面板 -->
<div class="panel" id="nav-panel">
  <div class="nav-head">
    <h1>🧭 <em>AI 智能导航</em></h1>
    <button id="nav-close" title="收起">—</button>
  </div>
  <div class="nav-body">
    <!-- 模式切换 -->
    <div class="nav-tabs">
      <div class="nav-tab on" data-mode="classic">经典</div>
      <div class="nav-tab" data-mode="ai">✨ 自然语言</div>
    </div>

    <!-- 经典模式 -->
    <div id="nav-classic">
      <div class="nav-field">
        <label>起点</label>
        <div class="nav-input-wrap">
          <input type="text" id="nav-from" placeholder="输入大楼名称，如：图书馆" autocomplete="off">
          <div id="nav-from-suggest" class="suggest-list hidden"></div>
        </div>
      </div>
      <div class="nav-field">
        <label>终点</label>
        <div class="nav-input-wrap">
          <input type="text" id="nav-to" placeholder="输入大楼名称，如：体育馆" autocomplete="off">
          <div id="nav-to-suggest" class="suggest-list hidden"></div>
        </div>
      </div>
      <button class="nav-btn" id="nav-go">开始导航</button>
    </div>

    <!-- 自然语言模式 -->
    <div id="nav-ai" style="display:none">
      <div class="nav-ai-input-wrap">
        <textarea id="nav-ai-input" placeholder="例如：从图书馆去体育馆，怎么走？"></textarea>
      </div>
      <button class="nav-btn" id="nav-ai-go">AI 帮我找路</button>
      <div class="nav-ai-status">
        <span class="dot"></span>
        <span id="nav-ai-status">已启用</span>
        <button class="nav-ai-btn" id="nav-ai-config">配置 API Key</button>
      </div>
    </div>

    <!-- 导航结果 -->
    <div id="nav-result" class="hidden">
      <div class="nr-title">📍 路线规划</div>
      <div class="nr-info">
        <div><span class="k">起点</span><span class="v" id="nri-from">—</span></div>
        <div><span class="k">终点</span><span class="v" id="nri-to">—</span></div>
        <div><span class="k">距离</span><span class="v" id="nri-dist">—</span></div>
        <div><span class="k">步行</span><span class="v" id="nri-time">—</span></div>
      </div>
      <div class="nr-desc" id="nri-desc">—</div>
    </div>
  </div>
</div>

<!-- AI 配置弹窗 -->
<div id="ai-config-modal" class="hidden">
  <div class="ai-config-box">
    <h2>🔑 AI API 配置</h2>
    <div class="field">
      <label>API Key</label>
      <input type="text" id="ai-api-key" placeholder="sk-...">
    </div>
    <div class="field">
      <label>API 地址</label>
      <input type="text" id="ai-api-url" value="https://api.deepseek.com/anthropic">
    </div>
    <div class="field">
      <label>模型名称</label>
      <input type="text" id="ai-model" value="deepseek-chat">
    </div>
    <div class="ai-config-btns">
      <button class="cancel" id="ai-config-cancel">取消</button>
      <button class="save" id="ai-config-save">保存</button>
    </div>
  </div>
</div>

<div id="load">
  <div class="t">正在加载全园模型</div>
  <div class="bar"><i id="load-bar"></i></div>
  <div class="b" id="load-txt">连接中…</div>
</div>

<script>
/* ==========================================================================
 * 加载守卫（2026-09-25 加）
 * --------------------------------------------------------------------------
 * ★ 为什么需要它（真实故障，不是假想）：
 *   `preview.js` 是 **ES module**，而 module 脚本受**严格 CORS 检查**。
 *   `file://` 的 origin 是 `null` ⇒ 浏览器直接拒绝加载，控制台报：
 *
 *     Access to script at 'file:///…/src/preview.js' from origin 'null'
 *     has been blocked by CORS policy: Cross origin requests are only
 *     supported for protocol schemes: chrome-extension, …, http, https, …
 *
 *   后果是 `preview.js` **一行都不执行** ⇒ 加载遮罩永远停在「连接中…」，
 *   而且因为脚本本身没跑起来，它内部那段友好的错误提示也永远不会显示。
 *   用户看到的就是"3D 预览一直转圈"，完全看不出是协议问题。
 *
 * ★ 为什么用**经典脚本**做守卫：
 *   经典 `<script>`（无 type=module）不受 CORS 约束，`file://` 下照常执行。
 *   于是我们可以在注入 module **之前**先判断协议，命中 `file:` 时**根本不注入**
 *   ⇒ 连那条 CORS 红错都不会产生，控制台是干净的。
 *
 * ★ 为什么不用「保留静态 module + 另外加提示」：
 *   那样遮罩上会出现提示，但控制台仍有一条 CORS 报错，
 *   而且 module 请求仍然发出去（网络面板多一条红）。不值得。
 * ========================================================================== */
(function () {
  var box = document.getElementById('load');
  var txt = document.getElementById('load-txt');

  if (location.protocol === 'file:') {
    var t = box && box.querySelector('.t');
    if (t) t.textContent = '需要通过网络地址打开';
    if (txt) {
      txt.outerHTML =
        '<div class="err">检测到用 <b>file://</b> 直接打开了本地文件。' +
        '浏览器会以 CORS 为由拒绝加载预览脚本，因此 3D 模型无法显示。<br><br>' +
        '① <b>在线看</b>：' +
        '<a style="color:#C9A87C" href="https://2cb735b0c4814c359bab62cc039d9c7a.sg2.agentos-app.run/preview.html">' +
        '公网地址</a><br>' +
        '② <b>本地看</b>：双击本目录下的 <code>serve.cmd</code>，' +
        '再打开 <a style="color:#C9A87C" href="http://localhost:8123/preview.html">' +
        'http://localhost:8123/preview.html</a></div>';
    }
    return;                       // ★ 关键：命中就到此为止，不注入 module
  }

  var s = document.createElement('script');
  s.type = 'module';
  s.src = './src/preview.js';
  document.body.appendChild(s);
})();
</script>
</body>
</html>
