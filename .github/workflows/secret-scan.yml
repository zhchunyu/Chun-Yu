name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tracked-text:
    runs-on: ubuntu-latest
    steps:
      # Official v4 tag verified at https://github.com/actions/checkout/releases/tag/v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test scanner
        run: node --test scripts/check-secrets.test.mjs
      - name: Scan tracked text
        run: node scripts/check-secrets.mjs
