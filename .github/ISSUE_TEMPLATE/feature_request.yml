name: 功能建议
description: 分享校园生活中的问题或改进建议
title: "[建议] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 遇到了什么问题？
      description: 请描述具体场景，以及目前怎样解决。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望怎样改进？
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 补充信息
      description: 可提供界面草图、例子或其他方案。
