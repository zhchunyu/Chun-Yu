<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1a20" />
    <title>OurCampus</title>
    <link rel="icon" type="image/png" href="/assets/brand/ourcampus-icon-32.png" />
    <style>
      /* Present before the application bundle, so loading starts on black. */
      html, body { margin: 0; background: #0e1316; }
      .app-startup {
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        overflow: hidden; background: #0e1316; opacity: 1;
        transition: opacity 550ms ease;
      }
      .app-startup__video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; }
      .app-startup__fallback { display: grid; justify-items: center; gap: 22px; visibility: hidden; color: #f6f8fa; font: 500 27px/1.2 Georgia, serif; }
      .app-startup__fallback img { width: 116px; height: 116px; border-radius: 26px; }
      .app-startup.is-playing .app-startup__video { opacity: 1; }
      .app-startup.is-static .app-startup__fallback { visibility: visible; }
      .app-startup.is-playing .app-startup__fallback { visibility: hidden; }
      .app-startup__status {
        position: absolute; bottom: max(11%, calc(env(safe-area-inset-bottom) + 28px)); margin: 0;
        color: #a3b1b4; font: 11px/1.5 "Microsoft YaHei", sans-serif;
        letter-spacing: .12em; opacity: 0; transition: opacity 500ms ease;
      }
      .app-startup.is-waiting .app-startup__status { opacity: 1; }
      .app-startup.is-leaving { opacity: 0; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) {
        .app-startup { transition-duration: 150ms; }
        .app-startup__video { display: none; }
        .app-startup__fallback { visibility: visible; }
        .app-startup__status { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="app-startup" class="app-startup" role="status" aria-label="OurCampus 正在启动">
      <video class="app-startup__video" src="/assets/brand/ourcampus-startup.mp4" autoplay muted playsinline preload="auto" disablepictureinpicture aria-hidden="true"></video>
      <div class="app-startup__fallback" aria-hidden="true"><img src="/assets/brand/ourcampus-icon-192.png" alt="" /><span>OurCampus</span></div>
      <p class="app-startup__status" aria-hidden="true">正在加载校园…</p>
      <noscript>请启用 JavaScript 后打开校园软件。</noscript>
    </div>
    <script>performance.mark('ourcampus-startup')</script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
