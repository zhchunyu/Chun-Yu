<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OurCampus 实际体验记录</title>
<style>body{font-family:"Microsoft YaHei",sans-serif;background:#f4f6f3;color:#152820;margin:0}main{max-width:920px;margin:35px auto;background:white;padding:38px;border:1px solid #dae2db}h1{font-size:28px}h2{font-size:20px;margin-top:34px}p{line-height:1.75;color:#4d5d53}label{display:block;margin:17px 0;font-weight:600}input,select,textarea{display:block;box-sizing:border-box;width:100%;padding:10px;border:1px solid #bdc9bf;border-radius:4px;margin-top:7px;background:white;font:inherit}textarea{min-height:90px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #d9e1da;padding:10px;text-align:left}td input,td select{min-width:90px}button{font:inherit;padding:12px 18px;border:1px solid #28634e;background:#28634e;color:white;cursor:pointer;margin:15px 12px 0 0}button.secondary{background:white;color:#28634e}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.small{font-size:13px}#notice{color:#785a24}@media(max-width:650px){main{margin:0;padding:20px}.grid{grid-template-columns:1fr}table{font-size:13px}}@media print{body{background:white}main{margin:0;border:0;padding:0}button,#notice{display:none}input,select,textarea{border-color:#aaa}}</style>
<main><h1>OurCampus 实际体验记录</h1><p>请在真实操作后填写。表格只在本机页面中处理，不自动上传，也不生成虚构记录。不要填写姓名、学号、邮箱或真实课表身份信息。</p><p id="notice">导出的JSON是原始记录。公开使用前应检查匿名性；没有体验的功能保留“不适用”。页面刷新后未导出的内容不会保留。</p>
<form id="record"><div class="grid"><label>匿名编号<input name="participant_id" placeholder="例如 U01" required pattern="U[0-9]{2,3}"></label><label>实际测试日期<input type="date" name="date" required></label><label>实际安装包版本<input name="apk_version" required></label><label>手机型号及安卓版本<input name="device_android" required></label></div><label>安装包SHA256<input name="apk_sha256" placeholder="由负责人登记，不知道时说明未登记"></label><label>是否第一次使用<select name="first_use"><option value="">请选择</option><option>是</option><option>否</option></select></label><label>任务顺序<select name="order" required><option value="">请选择实际顺序</option><option>App先，对照后</option><option>对照先，App后</option></select></label><label>固定对照方式<input name="comparison_method" placeholder="记录确实使用的工具或页面"></label>
<h2>任务记录</h2><p class="small">时间单位为秒；失败也要记录。任务：T1找地点并进入导航预览；T2整理情况并核对地点；T3查服务并确认资料。任务内容用A/B两套，记录实际使用哪套。</p><div style="overflow:auto"><table><thead><tr><th>任务与方式</th><th>A/B任务</th><th>完成秒数</th><th>结果</th><th>求助次数</th></tr></thead><tbody id="tasks"></tbody></table></div>
<h2>体验问卷</h2><label>实际体验的模块<input name="modules" placeholder="地图搜索、导航预览、事件分析、校园建议、课表等"></label><div id="ratings"></div><label>与对照方式相比<select name="comparison_feeling"><option>无法比较</option><option>更慢</option><option>差不多</option><option>更快</option></select></label><label>为什么？<textarea name="comparison_reason"></textarea></label><label>哪一步最有帮助？请举例<textarea name="helpful_example"></textarea></label><label>哪一步需要改进？<textarea name="improvement"></textarea></label><label>是否愿意再次使用<select name="reuse"><option>不确定</option><option>愿意</option><option>不愿意</option></select></label><label>数据使用选择<select name="consent" required><option value="">请选择</option><option>同意匿名统计及匿名评价引用</option><option>仅同意匿名统计，不引用评价</option><option>不同意竞赛材料使用</option></select></label><label>观察员备注<textarea name="observer_notes" placeholder="记录失败、缺失和特殊情况，不替使用者编写评价"></textarea></label><button type="submit">导出本条实际记录</button><button class="secondary" type="button" onclick="window.print()">打印空表或当前记录</button><p class="small">本页面不会发送邮件、注册账号或发布任何内容。</p></form></main>
<script>
for(const task of ['T1','T2','T3'])for(const method of ['app','comparison']){const key=task+'_'+method;document.getElementById('tasks').insertAdjacentHTML('beforeend',`<tr><td>${task} ${method==='app'?'App':'对照'}</td><td><input name="${key}_variant" placeholder="A/B"></td><td><input name="${key}_seconds" type="number" min="0" step="0.1"></td><td><select name="${key}_result"><option>未执行</option><option>成功</option><option>失败</option><option>中止</option></select></td><td><input name="${key}_help" type="number" min="0" step="1"></td></tr>`)}
for(const [key,label] of [['find_ease','找到功能是否容易'],['location_clarity','地点和操作是否清楚'],['auv_helpfulness','AUV是否解决本次问题']])document.getElementById('ratings').insertAdjacentHTML('beforeend',`<label>${label}<select name="${key}"><option>不适用</option><option value="1">1 最低</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5 最高</option></select></label>`);
document.getElementById('record').addEventListener('submit',e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));data.schema='OurCampus-real-user-record-v1';data.data_origin='负责人采集的实际体验记录，真实性需由采集者确认';data.exported_at=new Date().toISOString();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=data.participant_id+'_'+data.date+'_实际记录.json';a.click();URL.revokeObjectURL(url)});
</script></html>
